    /* =========================================================================

    function parseISO(str) {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatISO(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatBR(isoStr) {
      if (!isoStr) return '—';
      const [y, m, d] = isoStr.split('-');
      return `${d}/${m}/${y}`;
    }

    function addDays(isoStr, days) {
      const d = parseISO(isoStr);
      d.setDate(d.getDate() + days);
      return formatISO(d);
    }

    function getPhaseByDate(isoStr) {
      for (const p of PHASES) {
        if (isoStr >= p.start && isoStr <= p.end) return p;
      }
      return PHASES[0];
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* =========================================================================

    const SCHEDULE_LIST = [];
    const SCHEDULE_MAP = {};
    const ANNUAL_SIMULADOS_PLAN = [];

    function generateFullYearSchedule() {
      // Cursors to advance pedagogically through every subject's syllabus
      const cursors = {};
      SUBJECTS.forEach(s => { cursors[s.id] = 0; });
      let redacaoLessonIdx = 0;
      let sundayCount = 0;

      // High-yield ENEM topics for Phase 4 & 5
      const highYield = {
        matematica: ['Razão e proporção', 'Porcentagem', 'Estatística', 'Geometria plana', 'Geometria espacial', 'Funções', 'Probabilidade', 'Interpretação de gráficos e tabelas'],
        fisica: ['Eletricidade', 'Circuitos elétricos', 'Ondulatória', 'Termologia', 'Cinemática', 'Dinâmica', 'Trabalho e energia', 'Óptica'],
        quimica: ['Estequiometria', 'Química orgânica', 'Química ambiental', 'Eletroquímica', 'Termoquímica', 'Soluções', 'Ligações químicas', 'Equilíbrio químico'],
        biologia: ['Ecologia', 'Fisiologia humana', 'Genética', 'Citologia', 'Evolução', 'Imunologia', 'Biotecnologia', 'Saúde pública'],
        linguagens: ['Interpretação e compreensão textual', 'Gêneros textuais', 'Funções da linguagem', 'Figuras de linguagem', 'Variação linguística', 'Modernismo e movimentos literários', 'Tecnologias da comunicação'],
        historia: ['Brasil Colônia, Império e República', 'Era Vargas', 'Ditadura Militar', 'Escravidão e abolição', 'Redemocratização', 'Revoluções', 'História da África e dos povos indígenas'],

        atualidades: ['Tecnologia e inteligência artificial', 'Meio ambiente', 'Direitos humanos', 'Saúde pública', 'Educação', 'Conflitos internacionais'],
        redacao: ['Planejamento textual', 'Proposta de intervenção', 'Repertório sociocultural', 'Coesão e coerência', 'Argumentação autoral']
      };

      const redacaoThemes = [
        'Desafios para o cuidado com a saúde mental de jovens no Brasil',
        'A invisibilidade do trabalho de cuidado na sociedade brasileira',
        'Impactos das redes sociais e algoritmos na formação crítica dos cidadãos',
        'Caminhos para combater a evasão escolar no ensino médio público',
        'A persistência da insegurança alimentar no Brasil contemporâneo',
        'Democratização do acesso à cultura e aos espaços públicos urbanos',
        'Desafios éticos da inteligência artificial no mercado de trabalho brasileiro',
        'Preservação dos biomas brasileiros e justiça socioambiental',
        'Envelhecimento populacional e garantia de direitos da pessoa idosa',
        'Combate à desinformação científica e seus reflexos na saúde pública',
        'Mobilidade urbana sustentável e direito à cidade no Brasil',
        'Valorização dos povos originários e proteção territorial na atualidade'
      ];

      function nextTopic(subjId, phase) {
        const subj = SUBJECT_MAP[subjId];
        const idx = cursors[subjId]++;
        if (phase.id <= 3) {
          const cycle = Math.floor(idx / subj.topics.length);
          const topic = subj.topics[idx % subj.topics.length];
          if (cycle === 0) return { topic, stage: 'Fundamento e Teoria' };
          if (cycle === 1) return { topic, stage: 'Aprofundamento e Interpretação' };
          return { topic, stage: 'Questões Difíceis e Aplicações ENEM' };
        } else if (phase.id === 4) {
          const hy = highYield[subjId] || subj.topics;
          return { topic: hy[idx % hy.length], stage: 'Revisão Dirigida de Alta Incidência ENEM' };
        } else {
          const hy = highYield[subjId] || subj.topics;
          return { topic: hy[idx % hy.length], stage: 'Revisão Final Leve & Caderno de Erros' };
        }
      }

      function makeStudyTask(dateIso, slotIdx, subjId, phase) {
        const subj = SUBJECT_MAP[subjId];
        const { topic, stage } = nextTopic(subjId, phase);
        const q = phase.qDist;
        const activities = {
          1: `Montar resumo estruturado com conceitos-chave de "${topic}" e resolver as questões analisando cada alternativa.`,
          2: `Resolver lista contextualizada de "${topic}" cronometrando 3 min por questão e registrar erros no Caderno de Erros.`,
          3: `Fazer bateria focada em questões médias/difíceis de "${topic}" + criar 3 flashcards de revisão ativa.`,
          4: `Resolver questões oficiais de provas anteriores do ENEM sobre "${topic}" simulando ritmo de prova.`,
          5: `Revisão ativa de 15 min sem consultar o caderno sobre "${topic}" + refazer erros antigos desse tema.`
        };
        const objectives = {
          1: `Dominar a base teórica de ${topic} (${stage}) sem pressa e identificar eventuais lacunas.`,
          2: `Consolidar a interpretação e resolução autônoma de problemas envolvendo ${topic}.`,
          3: `Aumentar precisão e velocidade em ${topic}, focando nos detalhes mais cobrados pela banca do ENEM.`,
          4: `Blindar acertos em ${topic} usando provas anteriores oficiais do INEP e controle rigoroso de tempo.`,
          5: `Reforçar a memória de longo prazo em ${topic} com leveza, confiança e sem sobrecarga.`
        };
        const reviewNote = phase.id === 5
          ? `Revisar erros registrados no Caderno de Erros de ${subj.name} e descansar a mente após o bloco.`
          : `Revisão espaçada automática (24h, 7d e 30d) + recuperação ativa de 5 min ao final da sessão.`;

        return {
          id: `${dateIso}_${slotIdx}`,
          date: dateIso,
          subjectId: subjId,
          subjectName: subj.name,
          channel: subj.channel,
          topic: `${topic} (${stage})`,
          rawTopic: topic,
          objective: objectives[phase.id],
          ytQuery: `${subj.channel} ${topic} ENEM`,
          questions: { ...q },
          activity: activities[phase.id],
          review: reviewNote,
          type: 'estudo'
        };
      }

      function makeRedacaoModuleTask(dateIso, slotIdx, phase) {
        if (redacaoLessonIdx < ALL_REDACAO_LESSONS.length) {
          const lesson = ALL_REDACAO_LESSONS[redacaoLessonIdx++];
          return {
            id: `${dateIso}_${slotIdx}`,
            date: dateIso,
            subjectId: 'redacao',
            subjectName: 'Redação',
            channel: 'Luma e Ponto + curso Fernanda Pessoa',
            topic: `${lesson.code} — ${lesson.title}`,
            rawTopic: lesson.title,
            objective: `Assistir à aula ${lesson.code} (${lesson.moduleTitle}), registrar aprendizados na aba Redação e executar o exercício prático.`,
            ytQuery: `Luma e Ponto Fernanda Pessoa ${lesson.title} redação ENEM`,
            questions: { total: 0, facil: 0, media: 0, dificil: 0, enem: 0 },
            activity: lesson.exercise,
            review: 'Preencher anotações e aprendizados na aba Redação + revisão em 24h, 7d e 30d.',
            type: 'redacao_aula',
            lessonId: lesson.id
          };
        } else {
          const { topic, stage } = nextTopic('redacao', phase);
          return {
            id: `${dateIso}_${slotIdx}`,
            date: dateIso,
            subjectId: 'redacao',
            subjectName: 'Redação',
            channel: 'Luma e Ponto + curso Fernanda Pessoa',
            topic: `${topic} — ${stage}`,
            rawTopic: topic,
            objective: `Aperfeiçoar ${topic} visando nota acima de 900+ nas 5 competências do ENEM.`,
            ytQuery: `Luma e Ponto ${topic} redação ENEM`,
            questions: { total: 0, facil: 0, media: 0, dificil: 0, enem: 0 },
            activity: `Analisar 1 redação nota 1000 focando em "${topic}" e ajustar o próprio projeto de texto.`,
            review: 'Revisar fichas de competências C1 a C5 na aba Redação.',
            type: 'redacao_pratica'
          };
        }
      }

      function getSundaySimulado(dateIso, phase, sIdx) {
        let title = '';
        let category = '';
        let details = '';
        let duration = '';

        if (sIdx === 1) {
          category = 'Simulado Diagnóstico';
          title = 'Simulado Diagnóstico Inicial (45 questões mistas + Redação)';
          details = 'Mapear seu nível atual em todas as áreas sem pressão, identificando prioridades para a Fase 1.';
          duration = '3h30';
        } else if (phase.id === 1) {
          const areaCycle = ['Linguagens + Redação (45q + Red)', 'Ciências Humanas (45 questões)', 'Matemática Básica & Fundamentos (45 questões)', 'Ciências da Natureza (45 questões)'];
          category = 'Simulado por Área';
          title = `Simulado por Área — ${areaCycle[(sIdx - 2) % areaCycle.length]}`;
          details = 'Consolidar os fundamentos estudados no mês e começar a treinar leitura de enunciados do ENEM.';
          duration = '2h30 a 3h00';
        } else if (phase.id === 2) {
          const isDia1 = sIdx % 2 === 0;
          category = '2 Áreas + Redação';
          title = isDia1 ? 'Simulado Dia 1 — Linguagens + Humanas (90q) + Redação' : 'Simulado Dia 2 — Natureza + Matemática (90 questões)';
          details = 'Treinar resistência mental em blocos longos e aplicar a estratégia de priorizar questões fáceis e médias (TRI).';
          duration = isDia1 ? '5h30' : '5h00';
        } else if (phase.id === 3) {
          const isMeio = sIdx === 26 || sIdx === 27;
          const isDia1 = sIdx % 2 === 0;
          category = isMeio ? 'Simulado de Meio de Preparação' : 'Simulado Completo (90q)';
          title = isMeio
            ? `Simulado de Meio de Preparação — ${isDia1 ? 'Dia 1 Completo (90q + Redação)' : 'Dia 2 Completo (90q)'}`
            : `Simulado Completo ENEM — ${isDia1 ? 'Dia 1: Linguagens, Humanas e Redação' : 'Dia 2: Natureza e Matemática'}`;
          details = 'Avaliar evolução no 1º semestre de estudos, precisão nas médias/difíceis e ritmo por questão.';
          duration = isDia1 ? '5h30' : '5h00';
        } else if (phase.id === 4) {
          const isDia1 = sIdx % 2 === 0;
          category = 'Simulado Oficial ENEM';
          title = `Simulado Oficial (Prova Anterior INEP) — ${isDia1 ? 'Dia 1 (90q + Redação)' : 'Dia 2 (90q)'}`;

          details = 'Manter o ritmo sem fadiga mental, preservando sono, calma e confiança para os dias oficiais do ENEM 2027.';
          duration = '2h00 + Descanso';
        }

        const simObj = {
          id: `sim_${dateIso}`,
          index: sIdx,
          date: dateIso,
          phaseId: phase.id,
          phaseShort: phase.short,
          category,
          title,
          details,
          duration
        };
        ANNUAL_SIMULADOS_PLAN.push(simObj);
        return simObj;
      }

      let cur = parseISO(PLAN_START);
      const end = parseISO(PLAN_END);
      let dayNum = 0;

      while (cur <= end) {
        dayNum++;
        const dateIso = formatISO(cur);
        const dow = cur.getDay(); // 0=Sun..6=Sat
        const weekIndex = Math.floor((dayNum - 1) / 7) + 1;
        const phase = getPhaseByDate(dateIso);
        const tasks = [];
        let isSimuladoDay = false;
        let hasRedacao = false;

        if (dow === 1) {
          // Segunda: Matemática + História + Linguagens
          tasks.push(makeStudyTask(dateIso, 0, 'matematica', phase));
          tasks.push(makeStudyTask(dateIso, 1, 'historia', phase));
          tasks.push(makeStudyTask(dateIso, 2, 'linguagens', phase));
        } else if (dow === 2) {
          // Terça: Biologia + Geografia + Filosofia
          tasks.push(makeStudyTask(dateIso, 0, 'biologia', phase));
          tasks.push(makeStudyTask(dateIso, 1, 'geografia', phase));
          tasks.push(makeStudyTask(dateIso, 2, 'filosofia', phase));
        } else if (dow === 3) {
          // Quarta: Física + Redação (Módulos + Prática) + Atualidades
          hasRedacao = true;
          tasks.push(makeStudyTask(dateIso, 0, 'fisica', phase));
          tasks.push(makeRedacaoModuleTask(dateIso, 1, phase));
          tasks.push(makeStudyTask(dateIso, 2, 'atualidades', phase));
        } else if (dow === 4) {
          // Quinta: Química + Matemática + Sociologia
          tasks.push(makeStudyTask(dateIso, 0, 'quimica', phase));
          tasks.push(makeStudyTask(dateIso, 1, 'matematica', phase));
          tasks.push(makeStudyTask(dateIso, 2, 'sociologia', phase));
        } else if (dow === 5) {
          // Sexta: Linguagens + Biologia + História/Geografia (alternando)
          const altHuman = weekIndex % 2 === 1 ? 'historia' : 'geografia';
          tasks.push(makeStudyTask(dateIso, 0, 'linguagens', phase));
          tasks.push(makeStudyTask(dateIso, 1, 'biologia', phase));
          tasks.push(makeStudyTask(dateIso, 2, altHuman, phase));
        } else if (dow === 6) {
          // Sábado: Física/Química (alternando) + Produção/Reescrita de Redação + Revisão Semanal & Caderno de Erros
          hasRedacao = true;
          const altNat = weekIndex % 2 === 1 ? 'fisica' : 'quimica';
          const theme = redacaoThemes[(weekIndex - 1) % redacaoThemes.length];
          tasks.push(makeStudyTask(dateIso, 0, altNat, phase));
          tasks.push({
            id: `${dateIso}_1`,
            date: dateIso,
            subjectId: 'redacao',
            subjectName: 'Redação',
            channel: 'Luma e Ponto + curso Fernanda Pessoa',
            topic: `Produção Textual Cronometrada — Tema: "${theme}"`,
            rawTopic: theme,
            objective: phase.id >= 4
              ? 'Produzir redação completa em até 1h15 com projeto de texto rigoroso e autoavaliação pelas 5 competências.'
              : 'Planejar, redigir e revisar 1 redação completa aplicando os módulos estudados na quarta-feira.',
            ytQuery: `Luma e Ponto redação ENEM ${theme.split(' ').slice(0, 4).join(' ')}`,
            questions: { total: 0, facil: 0, media: 0, dificil: 0, enem: 0 },
            activity: 'Escrever o texto em folha pautada (máx. 30 linhas) e registrar as notas de C1 a C5 na aba Redação.',
            review: 'Comparar com redações anteriores para eliminar desvios repetidos.',
            type: 'redacao_producao'
          });
          tasks.push({
            id: `${dateIso}_2`,
            date: dateIso,
            subjectId: 'revisao',
            subjectName: 'Revisão & Erros',
            channel: 'Caderno de Erros + Revisão Ativa',
            topic: `Revisão Semanal #${weekIndex} — Refazer erros da semana e Flashcards`,
            rawTopic: `Revisão Semanal #${weekIndex}`,
            objective: 'Consolidar tudo o que foi estudado de segunda a sexta, revisar o Caderno de Erros e atualizar flashcards.',
            ytQuery: 'técnicas de revisão ativa e flashcards ENEM',
            questions: { total: phase.id === 5 ? 8 : 12, facil: 2, media: 4, dificil: 2, enem: phase.id === 5 ? 0 : 4 },
            activity: 'Abrir a aba Revisões, concluir as pendências de 24h/7d/30d e refazer as questões erradas sem olhar o gabarito.',
            review: 'Garantir que nenhum erro fique sem explicação registrada.',
            type: 'revisao'
          });
        } else {
          // Domingo: Simulado programado + Correção + Descanso obrigatório
          sundayCount++;
          isSimuladoDay = true;
          const sim = getSundaySimulado(dateIso, phase, sundayCount);
          tasks.push({
            id: `${dateIso}_0`,
            date: dateIso,
            subjectId: 'simulado',
            subjectName: 'Simulado',
            channel: 'Provas Anteriores oficiais INEP / ENEM',
            topic: sim.title,
            rawTopic: sim.title,
            objective: `${sim.details} Duração sugerida: ${sim.duration}.`,
            ytQuery: 'resolução comentada prova ENEM oficial',
            questions: { total: sim.title.includes('90') ? 90 : 45, facil: 0, media: 0, dificil: 0, enem: sim.title.includes('90') ? 90 : 45 },

    function loadState() {

        if (!raw) return getDefaultState();
        const parsed = JSON.parse(raw);
        return { ...getDefaultState(), ...parsed, uepbTracker: { ...getDefaultState().uepbTracker, ...(parsed.uepbTracker || {}) } };
      } catch (e) {
        return getDefaultState();
      }
    }

    /* =========================================================================
       5. CÁLCULO REAL DE INDICADORES (INICIANDO ESTRITAMENTE ZERADOS)
       ========================================================================= */
    function computeMetrics() {
      const totalTasks = SCHEDULE_LIST.reduce((acc, d) => acc + d.tasks.length, 0);
      let completedTasksCount = 0;
      let videosWatched = 0;
      let totalMinutes = 0;

      Object.values(state.taskProgress).forEach(tp => {
        if (tp.done) completedTasksCount++;
        if (tp.videoDone) videosWatched++;
        if (tp.minutes && Number(tp.minutes) > 0) totalMinutes += Number(tp.minutes);
      });

      // Add redacao lessons completed as videoaulas if marked done
      const redacaoLessonsDone = Object.values(state.redacaoLessons).filter(l => l.done).length;
      videosWatched += redacaoLessonsDone;

      // Question logs
      let qTotal = 0;
      let qCorrect = 0;
      const subjectStats = {};
      SUBJECTS.forEach(s => { subjectStats[s.id] = { total: 0, correct: 0 }; });

      state.questionLogs.forEach(log => {
        const t = Number(log.total) || 0;
        const c = Number(log.correct) || 0;
        qTotal += t;
        qCorrect += c;
        totalMinutes += Number(log.minutes) || 0;
        if (subjectStats[log.subjectId]) {
          subjectStats[log.subjectId].total += t;
          subjectStats[log.subjectId].correct += c;
        }
      });

      // Essays
      const essaysCount = state.redacaoHistory.length;
      const essayAvg = essaysCount > 0
        ? Math.round(state.redacaoHistory.reduce((a, r) => a + (Number(r.total) || 0), 0) / essaysCount)
        : 0;
      state.redacaoHistory.forEach(r => { totalMinutes += Number(r.minutes) || 0; });

      // Simulados
      const simuladosCount = state.simuladoLogs.length;
      state.simuladoLogs.forEach(s => { totalMinutes += Number(s.minutes) || 0; });

      const schedulePct = totalTasks > 0 ? Math.round((completedTasksCount / totalTasks) * 1000) / 10 : 0;
      const accuracyPct = qTotal > 0 ? Math.round((qCorrect / qTotal) * 1000) / 10 : 0;
      const hoursStudied = Math.round((totalMinutes / 60) * 10) / 10;

      return {
        totalTasks,
        completedTasksCount,
        schedulePct,
        hoursStudied,
        totalMinutes,
        videosWatched,
        qTotal,
        qCorrect,
        accuracyPct,
        essaysCount,
        essayAvg,
        simuladosCount,
        subjectStats
      };
    }

    function updateSidebarProgress() {
      const m = computeMetrics();
      const pctEl = document.getElementById('sidebarProgressPct');
      const barEl = document.getElementById('sidebarProgressBar');
      if (pctEl) pctEl.textContent = `${m.schedulePct}%`;
      if (barEl) barEl.style.width = `${Math.min(100, m.schedulePct)}%`;
    }

    /* =========================================================================
       6. REVISÃO ESPAÇADA AUTOMÁTICA (24H, 7D, 30D)
       ========================================================================= */
    function scheduleSpacedReviews(sourceKey, subjectId, topic, baseDateIso) {
      const intervals = [
        { type: '24h', days: 1 },
        { type: '7d', days: 7 },
        { type: '30d', days: 30 }
      ];
      let added = 0;
      intervals.forEach(iv => {
        const exists = state.reviews.some(r => r.sourceKey === sourceKey && r.type === iv.type);
        if (!exists) {
          state.reviews.push({
            id: `rev_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
            sourceKey,
            subjectId,
            topic,
            type: iv.type,
            dueDate: addDays(baseDateIso, iv.days),
            done: false,
            createdAt: baseDateIso
          });
          added++;
        }
      });
      return added;
    }

                      <input type="checkbox" ${g.done ? 'checked' : ''} onchange="toggleGoal('${g.id}')" class="mt-0.5 accent-emerald-600 rounded" />
                      <span class="text-xs font-medium ${g.done ? 'line-through text-slate-400' : 'text-slate-700'}">${escapeHtml(g.text)}</span>
                    </label>
                  `).join('')}
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function kpiCard(title, value, sub, icon, color) {
      const palette = {
        emerald: 'bg-emerald-50 text-emerald-700',
        teal: 'bg-teal-50 text-teal-700',
        indigo: 'bg-indigo-50 text-indigo-700',
        amber: 'bg-amber-50 text-amber-700',
        rose: 'bg-rose-50 text-rose-700',
        violet: 'bg-violet-50 text-violet-700'
      };
      return `
        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-semibold text-slate-500">${title}</span>
            <div class="w-8 h-8 rounded-xl ${palette[color]} flex items-center justify-center">
              <i data-lucide="${icon}" class="w-4 h-4"></i>
            </div>
          </div>
          <p class="font-display text-2xl font-extrabold text-slate-900">${value}</p>
          <p class="text-[11px] text-slate-500 mt-0.5 truncate">${sub}</p>
        </div>
      `;
    }

    function updateEnemDate() {
      const val = document.getElementById('enemDateInput')?.value;
      if (!val) return;
      state.enemDate = val;
      state.enemDateOfficial = true;
      saveState();
      showToast(`Data do ENEM 2027 atualizada para ${formatBR(val)}.`);
      renderCurrentPage();
    }

    /* =========================================================================
       9. PÁGINA 2 — MEU CRONOGRAMA (365 DIAS COMPLETOS)
       ========================================================================= */
    function renderCronograma(container) {
      const day = SCHEDULE_MAP[selectedCronogramaDate] || SCHEDULE_LIST[0];
      const currentMonthKey = day.date.slice(0, 7);
      const months = getMonthList();

      // Build week strip around selected day (Mon..Sun)
      const dObj = parseISO(day.date);
      const dow = dObj.getDay();
      const diffToMon = dow === 0 ? -6 : 1 - dow;
      const monDate = new Date(dObj);
      monDate.setDate(dObj.getDate() + diffToMon);

      const weekDays = [];
      for (let i = 0; i < 7; i++) {
        const wd = new Date(monDate);
        wd.setDate(monDate.getDate() + i);
        const iso = formatISO(wd);
        weekDays.push({ iso, inPlan: Boolean(SCHEDULE_MAP[iso]), dow: wd.getDay(), dayNum: wd.getDate() });
      }

      const dayDoneCount = day.tasks.filter(t => state.taskProgress[t.id]?.done).length;

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
          <div>
            <h2 class="font-display text-2xl font-extrabold text-slate-900">Meu Cronograma Diário</h2>
            <p class="text-sm text-slate-500">Planejamento completo de 365 dias (01/12/2026 a 30/11/2027) em ordem pedagógica.</p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <select onchange="jumpToMonth(this.value)" class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500">
              ${months.map(m => `<option value="${m.key}" ${m.key === currentMonthKey ? 'selected' : ''}>${m.label}</option>`).join('')}
            </select>
            <input type="date" min="${PLAN_START}" max="${PLAN_END}" value="${day.date}" onchange="selectScheduleDate(this.value)" class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
            <button onclick="selectScheduleDate(getDefaultActiveDate())" class="px-3.5 py-2 rounded-xl bg-emerald-50 text-emerald-800 border border-emerald-200 text-sm font-semibold hover:bg-emerald-100 transition">
              Hoje / Início
            </button>
          </div>
        </div>

        <!-- Week Strip Navigator -->
        <div class="bg-white rounded-2xl border border-slate-200 p-4 mb-6 shadow-xs">
          <div class="flex items-center justify-between mb-3">
            <button onclick="shiftScheduleDays(-7)" class="p-2 rounded-xl hover:bg-slate-100 text-slate-600 transition flex items-center gap-1 text-xs font-semibold">
              <i data-lucide="chevron-left" class="w-4 h-4"></i> Semana Anterior
            </button>
            <div class="text-center">
              <span class="text-xs font-bold px-2.5 py-0.5 rounded-full border ${day.phase.badge}">${day.phase.name}</span>
              <p class="text-xs text-slate-500 mt-1">Semana ${day.weekIndex} de 52 • Dia ${day.dayNum} de 365</p>
            </div>
            <button onclick="shiftScheduleDays(7)" class="p-2 rounded-xl hover:bg-slate-100 text-slate-600 transition flex items-center gap-1 text-xs font-semibold">
              Próxima Semana <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="grid grid-cols-7 gap-1.5 sm:gap-2">
            ${weekDays.map(wd => {
              const isSelected = wd.iso === day.date;
              const sched = SCHEDULE_MAP[wd.iso];
              const allDone = sched && sched.tasks.every(t => state.taskProgress[t.id]?.done);
              const someDone = sched && sched.tasks.some(t => state.taskProgress[t.id]?.done);
              return `
                <button ${wd.inPlan ? `onclick="selectScheduleDate('${wd.iso}')"` : 'disabled'} class="flex flex-col items-center py-2.5 px-1 rounded-xl border transition ${
                  !wd.inPlan
                    ? 'bg-slate-50 border-slate-100 text-slate-300 cursor-not-allowed'
                    : isSelected
                      ? 'bg-emerald-600 border-emerald-600 text-white shadow-sm'
                      : 'bg-white border-slate-200 hover:border-emerald-300 text-slate-700'
                }">
                  <span class="text-[11px] font-medium ${isSelected ? 'text-emerald-100' : 'text-slate-400'}">${WEEKDAY_SHORT[wd.dow]}</span>
                  <span class="font-display text-base font-bold mt-0.5">${wd.dayNum}</span>
                  <span class="w-1.5 h-1.5 rounded-full mt-1 ${
                    !wd.inPlan ? 'bg-transparent' : allDone ? (isSelected ? 'bg-white' : 'bg-emerald-500') : someDone ? 'bg-amber-400' : 'bg-slate-200'
                  }"></span>
                </button>
              `;
            }).join('')}
          </div>
        </div>

        <!-- Day Header -->
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
          <div class="flex items-center gap-3">
            <button onclick="shiftScheduleDays(-1)" class="p-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-600">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <div>
              <h3 class="font-display text-xl font-bold text-slate-900">${WEEKDAY_NAMES[day.dow]}, ${formatBR(day.date)}</h3>
              <p class="text-xs text-slate-500">${dayDoneCount} de ${day.tasks.length} sessões concluídas hoje</p>
            </div>
            <button onclick="shiftScheduleDays(1)" class="p-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-600">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="text-xs text-slate-600 bg-white border border-slate-200 rounded-xl px-3.5 py-2">
            <strong>Meta da fase:</strong> ${day.phase.questionTarget}
          </div>
        </div>

        <!-- Detailed Task Cards -->
        <div class="space-y-4">
          ${day.tasks.map((t, idx) => {
            const tp = state.taskProgress[t.id] || { done: false, videoDone: false, link: '', minutes: '' };
            const subj = SUBJECT_MAP[t.subjectId];
            const badgeClass = subj ? subj.badge : 'bg-slate-100 text-slate-800';
            return `
              <div class="bg-white rounded-2xl border ${tp.done ? 'border-emerald-300 ring-1 ring-emerald-100' : 'border-slate-200'} p-5 shadow-xs transition">
                <div class="flex flex-col md:flex-row md:items-start justify-between gap-4">
                  <div class="flex items-start gap-3.5 flex-1">
                    <input type="checkbox" ${tp.done ? 'checked' : ''} onchange="toggleTaskDone('${t.id}', '${day.date}', '${t.subjectId}', '${escapeHtml(t.rawTopic)}')" class="mt-1 w-5 h-5 rounded-md accent-emerald-600 cursor-pointer shrink-0" />
                    <div class="flex-1 min-w-0">
                      <div class="flex flex-wrap items-center gap-2 mb-1.5">
                        <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${badgeClass}">Bloco ${idx + 1} • ${t.subjectName}</span>
                        <span class="text-xs font-medium text-slate-500 flex items-center gap-1">
                          <i data-lucide="youtube" class="w-3.5 h-3.5 text-rose-500"></i> ${t.channel}
                        </span>
                      </div>
                      <h4 class="font-display font-bold text-base sm:text-lg ${tp.done ? 'line-through text-slate-400' : 'text-slate-900'}">${escapeHtml(t.topic)}</h4>
                      <p class="text-sm text-slate-600 mt-1"><strong>Objetivo:</strong> ${escapeHtml(t.objective)}</p>
                    </div>
                  </div>

                  <!-- Time Studied Input -->
                  <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 self-start">
                    <i data-lucide="clock" class="w-4 h-4 text-slate-400"></i>
                    <input type="number" min="0" max="600" placeholder="Min" value="${tp.minutes || ''}" onchange="updateTaskField('${t.id}', 'minutes', this.value)" class="w-16 bg-transparent text-sm font-semibold text-slate-800 focus:outline-none" />
                    <span class="text-xs text-slate-500">min</span>
                  </div>
                </div>

                <!-- Details Grid -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-4 pt-4 border-t border-slate-100">
                  <!-- Videoaula Block -->
                  <div class="bg-slate-50/80 rounded-xl p-3.5 border border-slate-100">
                    <div class="flex items-center justify-between mb-2">
                      <span class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                        <i data-lucide="play-circle" class="w-4 h-4 text-rose-600"></i> Videoaula
                      </span>
                      <label class="flex items-center gap-1.5 text-xs font-semibold text-emerald-700 cursor-pointer">
                        <input type="checkbox" ${tp.videoDone ? 'checked' : ''} onchange="updateTaskField('${t.id}', 'videoDone', this.checked)" class="accent-emerald-600 rounded" />
                        Assistida
                      </label>
                    </div>
                    <a href="${ytSearchUrl(t.ytQuery)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs font-semibold text-rose-700 bg-rose-50 hover:bg-rose-100 px-2.5 py-1.5 rounded-lg transition mb-2">
                      <i data-lucide="search" class="w-3.5 h-3.5"></i> Pesquisar no YouTube
                    </a>
                    <input type="url" placeholder="Cole aqui o link da aula escolhida..." value="${escapeHtml(tp.link || '')}" onchange="updateTaskField('${t.id}', 'link', this.value)" class="w-full text-xs bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                    ${tp.link ? `<a href="${escapeHtml(tp.link)}" target="_blank" rel="noopener noreferrer" class="inline-block text-[11px] font-semibold text-emerald-700 hover:underline mt-1">Abrir link salvo ↗</a>` : ''}
                  </div>

                  <!-- Questions Block -->
                  <div class="bg-amber-50/60 rounded-xl p-3.5 border border-amber-100">
                    <span class="text-xs font-bold text-amber-900 flex items-center gap-1.5 mb-2">
                      <i data-lucide="list-checks" class="w-4 h-4 text-amber-600"></i> Meta de Questões
                    </span>
                    ${t.questions.total > 0 ? `
                      <p class="font-display font-extrabold text-lg text-amber-900">${t.questions.total} questões</p>
                      <div class="flex flex-wrap gap-1.5 mt-1.5 text-[11px] font-semibold">
                        ${t.questions.facil ? `<span class="px-2 py-0.5 rounded bg-white text-emerald-700 border border-emerald-100">${t.questions.facil} Fáceis</span>` : ''}
                        ${t.questions.media ? `<span class="px-2 py-0.5 rounded bg-white text-amber-700 border border-amber-100">${t.questions.media} Médias</span>` : ''}
                        ${t.questions.dificil ? `<span class="px-2 py-0.5 rounded bg-white text-rose-700 border border-rose-100">${t.questions.dificil} Difíceis</span>` : ''}
                        ${t.questions.enem ? `<span class="px-2 py-0.5 rounded bg-white text-indigo-700 border border-indigo-100">${t.questions.enem} ENEM</span>` : ''}
                      </div>
                    ` : `
                      <p class="text-xs text-amber-900/80 leading-relaxed">Sessão prática sem bateria numérica fixa (foco em escrita/correção/descanso).</p>
                    `}
                  </div>

                  <!-- Activity & Review Block -->
                  <div class="bg-teal-50/60 rounded-xl p-3.5 border border-teal-100">
                    <span class="text-xs font-bold text-teal-900 flex items-center gap-1.5 mb-1.5">
                      <i data-lucide="sparkles" class="w-4 h-4 text-teal-600"></i> Atividade & Revisão
                    </span>
                    <p class="text-xs text-slate-700 leading-relaxed"><strong>Prática:</strong> ${escapeHtml(t.activity)}</p>
                    <p class="text-xs text-teal-800 mt-1.5 leading-relaxed"><strong>Revisão:</strong> ${escapeHtml(t.review)}</p>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function selectScheduleDate(iso) {
      if (SCHEDULE_MAP[iso]) {
        selectedCronogramaDate = iso;
        renderCurrentPage();
      }
    }

    function jumpToMonth(monthKey) {
      const firstDay = `${monthKey}-01`;
      if (SCHEDULE_MAP[firstDay]) {
        selectedCronogramaDate = firstDay;
        renderCurrentPage();
      }
    }

    function shiftScheduleDays(delta) {
      const next = addDays(selectedCronogramaDate, delta);
      if (SCHEDULE_MAP[next]) {
        selectedCronogramaDate = next;
        renderCurrentPage();
      } else {
        showToast('Limite do período do plano (01/12/2026 a 30/11/2027) atingido.', 'info');
      }
    }

    function toggleTaskDone(taskId, dateIso, subjectId, rawTopic) {
      if (!state.taskProgress[taskId]) state.taskProgress[taskId] = {};
      const nextDone = !state.taskProgress[taskId].done;
      state.taskProgress[taskId].done = nextDone;
      state.taskProgress[taskId].completedAt = nextDone ? formatISO(new Date()) : null;

      if (nextDone && subjectId !== 'revisao' && subjectId !== 'simulado') {
        const added = scheduleSpacedReviews(`task_${taskId}`, subjectId, rawTopic, dateIso);
        if (added > 0) {
          showToast(`Sessão concluída! ${added} revisões espaçadas (24h, 7d, 30d) agendadas.`);
        } else {
          showToast('Sessão marcada como concluída!');
        }
      } else if (nextDone) {
        showToast('Sessão marcada como concluída!');
      }
      saveState();
      renderCurrentPage();
    }

    function updateTaskField(taskId, field, value) {
      if (!state.taskProgress[taskId]) state.taskProgress[taskId] = {};
      state.taskProgress[taskId][field] = value;
      saveState();
      if (field === 'videoDone') {
        showToast(value ? 'Videoaula marcada como assistida!' : 'Videoaula desmarcada.', 'info');
      }
      if (field === 'minutes') {
        updateSidebarProgress();
      }
    }

    /* =========================================================================
       10. PÁGINA 3 — CALENDÁRIO (MENSAL E SEMANAL)
       ========================================================================= */
    function renderCalendario(container) {
      const months = getMonthList();
      const curM = months.find(m => m.key === calendarMonthKey) || months[0];

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
          <div>
            <h2 class="font-display text-2xl font-extrabold text-slate-900">Calendário de Estudos</h2>
            <p class="text-sm text-slate-500">Visão mensal e semanal de Dezembro/2026 a Novembro/2027. Clique em qualquer dia para abrir as tarefas.</p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <div class="bg-white border border-slate-200 rounded-xl p-1 flex">
              <button onclick="setCalendarMode('mensal')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${calendarViewMode === 'mensal' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-100'}">Mensal</button>
              <button onclick="setCalendarMode('semanal')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${calendarViewMode === 'semanal' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-100'}">Semanal</button>
            </div>
            ${calendarViewMode === 'mensal' ? `
              <select onchange="setCalendarMonth(this.value)" class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold text-slate-700">
                ${months.map(m => `<option value="${m.key}" ${m.key === curM.key ? 'selected' : ''}>${m.label}</option>`).join('')}
              </select>
            ` : `
              <div class="flex items-center gap-1">
                <button onclick="shiftCalendarWeek(-7)" class="p-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                <button onclick="shiftCalendarWeek(7)" class="p-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
              </div>
            `}
          </div>
        </div>

        <!-- Legend -->
        <div class="flex flex-wrap items-center gap-3 mb-4 text-xs font-semibold text-slate-600">
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Dia concluído</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-violet-500"></span> Simulado</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Redação</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-teal-500"></span> Revisões agendadas</span>
        </div>

        ${calendarViewMode === 'mensal' ? renderMonthlyCalendarGrid(curM) : renderWeeklyCalendarGrid()}
      `;
    }

    function renderMonthlyCalendarGrid(mObj) {
      const firstOfMonth = new Date(mObj.year, mObj.month, 1);
      const daysInMonth = new Date(mObj.year, mObj.month + 1, 0).getDate();
      const startDow = firstOfMonth.getDay();
      const phaseOfMonth = getPhaseByDate(`${mObj.key}-01`);

      let cells = '';
      for (let i = 0; i < startDow; i++) {
        cells += `<div class="bg-slate-50/50 rounded-xl min-h-[86px] border border-slate-100"></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const iso = `${mObj.key}-${String(d).padStart(2, '0')}`;
        const dayData = SCHEDULE_MAP[iso];
        const doneCount = dayData ? dayData.tasks.filter(t => state.taskProgress[t.id]?.done).length : 0;
        const totalCount = dayData ? dayData.tasks.length : 0;
        const pct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
        const hasRev = state.reviews.some(r => !r.done && r.dueDate === iso);

        cells += `
          <button onclick="goToDayInSchedule('${iso}')" class="text-left bg-white hover:border-emerald-400 border ${pct === 100 && totalCount > 0 ? 'border-emerald-300 bg-emerald-50/30' : 'border-slate-200'} rounded-xl p-2 sm:p-2.5 min-h-[88px] flex flex-col justify-between transition group">
            <div class="flex items-center justify-between w-full">
              <span class="font-display font-bold text-sm text-slate-800 group-hover:text-emerald-700">${d}</span>
              <div class="flex items-center gap-1">
                ${dayData?.isSimuladoDay ? `<span class="w-2 h-2 rounded-full bg-violet-500" title="Simulado"></span>` : ''}
                ${dayData?.hasRedacao ? `<span class="w-2 h-2 rounded-full bg-rose-500" title="Redação"></span>` : ''}
                ${hasRev ? `<span class="w-2 h-2 rounded-full bg-teal-500" title="Revisões pendentes"></span>` : ''}
              </div>
            </div>
            <div class="mt-1 space-y-0.5 hidden sm:block">
              ${dayData ? dayData.tasks.slice(0, 2).map(t => `<p class="text-[10px] text-slate-500 truncate">${t.subjectName}</p>`).join('') : ''}
            </div>
            <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden mt-2">
              <div class="h-full bg-emerald-500 rounded-full" style="width:${pct}%"></div>
            </div>
          </button>
        `;
      }

      return `
        <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-xs">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-display font-bold text-lg text-slate-900">${mObj.label}</h3>
            <span class="text-xs font-bold px-2.5 py-1 rounded-full border ${phaseOfMonth.badge}">${phaseOfMonth.name}</span>
          </div>
          <div class="grid grid-cols-7 gap-1.5 sm:gap-2 mb-2 text-center">
            ${WEEKDAY_SHORT.map(w => `<div class="text-xs font-bold text-slate-400 py-1">${w}</div>`).join('')}
          </div>
          <div class="grid grid-cols-7 gap-1.5 sm:gap-2">
            ${cells}
          </div>
        </div>
      `;
    }

    function renderWeeklyCalendarGrid() {
      const base = parseISO(calendarWeekDate);
      const dow = base.getDay();
      const diff = dow === 0 ? -6 : 1 - dow;
      const mon = new Date(base);
      mon.setDate(base.getDate() + diff);

      const cols = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(mon);
        d.setDate(mon.getDate() + i);
        const iso = formatISO(d);
        cols.push({ iso, data: SCHEDULE_MAP[iso], dow: d.getDay() });
      }

      return `
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-7 gap-3">
          ${cols.map(c => {
            if (!c.data) {
              return `<div class="bg-slate-100/70 rounded-2xl p-4 border border-slate-200 text-xs text-slate-400">Fora do período (${formatBR(c.iso)})</div>`;
            }
            return `
              <div class="bg-white rounded-2xl border border-slate-200 p-3.5 flex flex-col justify-between shadow-xs">
                <div>
                  <div class="flex items-center justify-between border-b border-slate-100 pb-2 mb-2.5">
                    <div>
                      <p class="text-xs font-bold text-emerald-700">${WEEKDAY_SHORT[c.dow]}</p>
                      <p class="font-display font-bold text-sm text-slate-900">${formatBR(c.iso).slice(0, 5)}</p>
                    </div>
                    <button onclick="goToDayInSchedule('${c.iso}')" class="text-[11px] font-semibold text-emerald-700 hover:underline">Abrir</button>
                  </div>
                  <div class="space-y-2">
                    ${c.data.tasks.map(t => {

    function setCalendarMode(mode) { calendarViewMode = mode; renderCurrentPage(); }
    function setCalendarMonth(mKey) { calendarMonthKey = mKey; renderCurrentPage(); }
    function shiftCalendarWeek(delta) {
      const next = addDays(calendarWeekDate, delta);
      if (next >= PLAN_START && next <= PLAN_END) {
        calendarWeekDate = next;
        renderCurrentPage();
      }
    }

      if (!state.syllabusProgress[key]) state.syllabusProgress[key] = {};
      const next = !state.syllabusProgress[key].done;
      state.syllabusProgress[key].done = next;
      if (next) {
        scheduleSpacedReviews(`syl_${key}`, subjId, topic, getDefaultActiveDate());
        showToast(`"${topic}" concluído! Revisões 24h, 7d e 30d agendadas.`);
      }
      saveState();
      renderCurrentPage();
    }

    function saveSyllabusLink(key, url) {
      if (!state.syllabusProgress[key]) state.syllabusProgress[key] = {};
      state.syllabusProgress[key].link = url;
      saveState();
      showToast('Link da videoaula salvo.');

      const added = scheduleSpacedReviews(`man_${subjId}_${Date.now()}`, subjId, topic, getDefaultActiveDate());

    function submitQuestionLog(e) {
      e.preventDefault();
      const facil = Number(document.getElementById('qFacil').value) || 0;
      const media = Number(document.getElementById('qMedia').value) || 0;
      const dificil = Number(document.getElementById('qDificil').value) || 0;
      const enem = Number(document.getElementById('qEnem').value) || 0;
      const total = facil + media + dificil + enem;
      const correct = Number(document.getElementById('qCorrect').value) || 0;

      if (total <= 0) {
        showToast('Informe pelo menos 1 questão nos campos de dificuldade.', 'error');
        return;
      }
      if (correct > total) {
        showToast('O número de acertos não pode ser maior que o total de questões.', 'error');
        return;
      }

      state.questionLogs.push({
        id: `ql_${Date.now()}`,
        date: formatISO(new Date()),
        subjectId: document.getElementById('qSubject').value,
        topic: document.getElementById('qTopic').value.trim(),
        facil, media, dificil, enem, total, correct,
        minutes: Number(document.getElementById('qMinutes').value) || 0
      });
      saveState();
      showToast(`Bateria de ${total} questões salva (${correct} acertos)!`);
      renderCurrentPage();
    }

    function deleteQuestionLog(id) {
      state.questionLogs = state.questionLogs.filter(x => x.id !== id);
      saveState();
      renderCurrentPage();
    }

    function submitErrorEntry(e) {
      e.preventDefault();
      const subjId = document.getElementById('errSubject').value;
      const topic = document.getElementById('errTopic').value.trim();
      const revDate = document.getElementById('errRevDate').value;

      state.errorNotebook.unshift({
        id: `err_${Date.now()}`,
        questionRef: document.getElementById('errRef').value.trim(),
        subjectId: subjId,
        topic,
        reason: document.getElementById('errReason').value.trim(),
        solution: document.getElementById('errSolution').value.trim(),
        reviewDate: revDate,
        reviewed: false
      });

      // Also add to spaced reviews queue
      state.reviews.push({
        id: `rev_err_${Date.now()}`,
        sourceKey: `err_${Date.now()}`,
        subjectId: subjId,
        topic: `Caderno de Erros: ${topic}`,
        type: 'Erro',
        dueDate: revDate,
        done: false,
        createdAt: formatISO(new Date())
      });

      saveState();
      showToast('Erro salvo no Caderno de Erros e agendado para revisão!');
      renderCurrentPage();
    }

    function toggleErrorReviewed(id) {
      const item = state.errorNotebook.find(e => e.id === id);
      if (item) {
        item.reviewed = !item.reviewed;
        saveState();
        renderCurrentPage();
      }
    }

    function deleteErrorEntry(id) {
      state.errorNotebook = state.errorNotebook.filter(e => e.id !== id);
      saveState();
      renderCurrentPage();
    }

              <select id="arType" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">

    function setRevisaoTab(tab) { activeRevisaoTab = tab; renderCurrentPage(); }
    function completeReview(id) {
      const r = state.reviews.find(x => x.id === id);
      if (r) { r.done = true; saveState(); showToast('Revisão concluída!'); renderCurrentPage(); }
    }
    function deleteReview(id) { state.reviews = state.reviews.filter(x => x.id !== id); saveState(); renderCurrentPage(); }
    function submitManualReview(e) {
      e.preventDefault();
      const added = scheduleSpacedReviews(`man_${Date.now()}`, document.getElementById('revSubj').value, document.getElementById('revTopic').value.trim(), document.getElementById('revDate').value);
      saveState();
      showToast(`${added} revisões agendadas!`);
      renderCurrentPage();
    }
    function submitFlashcard(e) {
      e.preventDefault();
      state.flashcards.push({
        id: `fc_${Date.now()}`,
        subjectId: document.getElementById('fcSubj').value,
        front: document.getElementById('fcFront').value.trim(),
        back: document.getElementById('fcBack').value.trim(),
        mastery: 'novo'
      });
      activeFlashcardIdx = state.flashcards.length - 1;
      flashcardFlipped = false;
      saveState();
      showToast('Flashcard adicionado!');
      renderCurrentPage();
    }
    function flipFlashcard() { flashcardFlipped = !flashcardFlipped; renderCurrentPage(); }
    function navFlashcard(d) {
      if (!state.flashcards.length) return;
      activeFlashcardIdx = (activeFlashcardIdx + d + state.flashcards.length) % state.flashcards.length;
      flashcardFlipped = false;
      renderCurrentPage();
    }
    function rateFlashcard(id, status) {
      const c = state.flashcards.find(x => x.id === id);
      if (c) { c.mastery = status; saveState(); navFlashcard(1); }
    }
    function deleteFlashcard(id) {
      state.flashcards = state.flashcards.filter(x => x.id !== id);
      activeFlashcardIdx = 0;
      flashcardFlipped = false;
      saveState();
      renderCurrentPage();
    }
    function submitActiveRecall(e) {
      e.preventDefault();
      state.activeRecalls.push({
        id: `ar_${Date.now()}`,
        date: formatISO(new Date()),
        type: document.getElementById('arType').value,
        subjectId: document.getElementById('arSubj').value,
        topic: document.getElementById('arTopic').value.trim(),
        notes: document.getElementById('arNotes').value.trim()
      });
      saveState();
      showToast('Sessão de revisão ativa registrada!');
      renderCurrentPage();
    }
    function deleteActiveRecall(id) { state.activeRecalls = state.activeRecalls.filter(x => x.id !== id); saveState(); renderCurrentPage(); }

          </div>
          <div class="bg-white border border-slate-200 rounded-xl p-1 flex self-start">
            <button onclick="setRedacaoTab('modulos')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${activeRedacaoTab === 'modulos' ? 'bg-rose-600 text-white' : 'text-slate-600'}">Módulos & Aulas (${doneLessons}/${totalLessons})</button>

        ${activeRedacaoTab === 'modulos' ? `
          <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-6 text-xs text-amber-900 flex items-start gap-2.5">
            <i data-lucide="info" class="w-4 h-4 text-amber-600 shrink-0 mt-0.5"></i>
            <span><strong>Nota de fidelidade ao plano:</strong> Os módulos abaixo seguem exatamente a sua lista oficial (Módulos 01, 02, 03 e 05). O Módulo 04 não foi incluído nem inventado pois não constava na lista disponibilizada.</span>
          </div>

          <div class="space-y-6">
            ${REDACAO_MODULES.map(mod => {
              const modDone = mod.lessons.filter(l => state.redacaoLessons[l.id]?.done).length;
              return `
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs">
                  <div class="flex flex-wrap items-center justify-between gap-2 pb-4 border-b border-slate-100 mb-4">

                      <p class="text-xs text-slate-500">${mod.subtitle}</p>

                    <span class="text-xs font-bold px-3 py-1 rounded-full bg-rose-50 text-rose-700 border border-rose-200">${modDone}/${mod.lessons.length} concluídas</span>
                  </div>

                  <div class="space-y-2.5">
                    ${mod.lessons.map(l => {
                      const lp = state.redacaoLessons[l.id] || {};
                      return `
                        <details class="group rounded-2xl border ${lp.done ? 'bg-emerald-50/40 border-emerald-200' : 'bg-slate-50/70 border-slate-200'} overflow-hidden">

                            <div class="flex items-center gap-3 min-w-0">

                              <div class="min-w-0">

                                <span class="text-sm font-bold ${lp.done ? 'line-through text-slate-500' : 'text-slate-900'}">${escapeHtml(l.title)}</span>
                              </div>
                            </div>
                            <span class="text-xs font-semibold text-slate-400 group-open:rotate-180 transition-transform shrink-0">
                              <i data-lucide="chevron-down" class="w-4 h-4"></i>
                            </span>
                          </summary>
                          <div class="p-4 pt-2 border-t border-slate-200/70 bg-white space-y-3">

    function renderRedacaoAvaliacaoTab() {
      const scores = [0, 40, 80, 120, 160, 200];
      const comps = [
        { id: 'c1', name: 'C1 — Norma Culta (Gramática)' },
        { id: 'c2', name: 'C2 — Tema, Tipo Textual e Repertório' },
        { id: 'c3', name: 'C3 — Projeto de Texto e Argumentação' },
        { id: 'c4', name: 'C4 — Coesão Textual (Conectivos)' },
        { id: 'c5', name: 'C5 — Proposta de Intervenção (5 elementos)' }
      ];

      return `

            <div>

                  <tr class="border-b border-slate-200 text-slate-500">

                    <th class="py-2 pr-3">Tema</th>
                    <th class="py-2 pr-3">C1/C2/C3/C4/C5</th>
                    <th class="py-2 pr-3">Nota Final</th>
                    <th class="py-2">Ação</th>

                <tbody class="divide-y divide-slate-100">
                  ${state.redacaoHistory.slice().reverse().map(r => `
                    <tr>
                      <td class="py-2.5 pr-3 font-medium">${formatBR(r.date)}</td>
                      <td class="py-2.5 pr-3 font-bold text-slate-800">${escapeHtml(r.theme)}</td>
                      <td class="py-2.5 pr-3 text-slate-600">${r.c1} / ${r.c2} / ${r.c3} / ${r.c4} / ${r.c5}</td>

    function setRedacaoTab(tab) { activeRedacaoTab = tab; renderCurrentPage(); }

    function toggleRedacaoLesson(lessonId, title) {
      if (!state.redacaoLessons[lessonId]) state.redacaoLessons[lessonId] = {};
      const next = !state.redacaoLessons[lessonId].done;
      state.redacaoLessons[lessonId].done = next;
      if (next && !state.redacaoLessons[lessonId].date) {
        state.redacaoLessons[lessonId].date = formatISO(new Date());
      }
      if (next) {
        scheduleSpacedReviews(`red_${lessonId}`, 'redacao', `${lessonId} — ${title}`, getDefaultActiveDate());
        showToast(`Aula ${lessonId} concluída! Revisões agendadas.`);
      }
      saveState();
      renderCurrentPage();
    }

    function updateRedacaoLesson(lessonId, field, value) {
      if (!state.redacaoLessons[lessonId]) state.redacaoLessons[lessonId] = {};
      state.redacaoLessons[lessonId][field] = value;
      saveState();
    }

    function updateRedacaoLiveSum() {
      const sum = ['c1', 'c2', 'c3', 'c4', 'c5'].reduce((a, k) => a + (Number(document.getElementById(`red_${k}`)?.value) || 0), 0);
      const el = document.getElementById('redacaoLiveTotal');
      if (el) el.textContent = `${sum} pts`;
    }

    function submitRedacaoHistory(e) {
      e.preventDefault();
      const c1 = Number(document.getElementById('red_c1').value) || 0;
      const c2 = Number(document.getElementById('red_c2').value) || 0;
      const c3 = Number(document.getElementById('red_c3').value) || 0;
      const c4 = Number(document.getElementById('red_c4').value) || 0;
      const c5 = Number(document.getElementById('red_c5').value) || 0;
      const total = c1 + c2 + c3 + c4 + c5;

      state.redacaoHistory.push({
        id: `rh_${Date.now()}`,
        date: document.getElementById('redDate').value,
        theme: document.getElementById('redTheme').value.trim(),
        minutes: Number(document.getElementById('redMinutes').value) || 0,
        c1, c2, c3, c4, c5, total,
        notes: document.getElementById('redNotes').value.trim()
      });
      saveState();
      showToast(`Redação registrada com ${total} pontos!`);
      renderCurrentPage();
    }

    function deleteRedacaoHistory(id) {
      state.redacaoHistory = state.redacaoHistory.filter(r => r.id !== id);
      saveState();
      renderCurrentPage();
    }

    function initRedacaoChart() {
      const ctx = document.getElementById('redacaoEvolutionChart');
      if (!ctx) return;
      const labels = state.redacaoHistory.length ? state.redacaoHistory.map((r, i) => `#${i + 1} (${formatBR(r.date).slice(0, 5)})`) : ['Sem registros'];
      const data = state.redacaoHistory.length ? state.redacaoHistory.map(r => r.total) : [0];
      chartInstances.push(new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Nota Total (0 a 1000)',
            data,
            borderColor: '#e11d48',
            backgroundColor: 'rgba(225, 29, 72, 0.12)',
            fill: true,
            tension: 0.3,
            pointRadius: 5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { min: 0, max: 1000 } }
        }
      }));
    }

    function submitSimuladoLog(e) {

        type: document.getElementById('simType').value,

        ling: Number(document.getElementById('simLing').value) || 0,

        nat: Number(document.getElementById('simNat').value) || 0,

    /* =========================================================================
       16. PÁGINA 9 — DESEMPENHO (INDICADORES ZERADOS + GRÁFICOS CHART.JS)
       ========================================================================= */
    function renderDesempenho(container) {
      const m = computeMetrics();

      container.innerHTML = `
        <div class="mb-6">
          <h2 class="font-display text-2xl font-extrabold text-slate-900">Painel de Desempenho & Evolução</h2>
          <p class="text-sm text-slate-500">Indicadores reais atualizados automaticamente conforme você conclui tarefas, resolve questões, escreve redações e faz simulados.</p>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
          ${kpiCard('Cronograma Concluído', `${m.schedulePct}%`, `${m.completedTasksCount}/${m.totalTasks} sessões`, 'check-circle-2', 'emerald')}
          ${kpiCard('Horas Estudadas', `${m.hoursStudied}h`, `${m.totalMinutes} minutos`, 'clock', 'teal')}
          ${kpiCard('Videoaulas Assistidas', `${m.videosWatched}`, 'Cronograma + Redação', 'play-circle', 'indigo')}

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs">
            <h3 class="font-display font-bold text-slate-900 text-base mb-3">Taxa de Acertos por Disciplina (%)</h3>
            <div class="h-64 relative"><canvas id="chartAccBySubj"></canvas></div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs">
            <h3 class="font-display font-bold text-slate-900 text-base mb-3">Evolução das Notas de Redação</h3>
            <div class="h-64 relative"><canvas id="chartEssayProg"></canvas></div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs">
            <h3 class="font-display font-bold text-slate-900 text-base mb-3">Evolução de Acertos nos Simulados</h3>
            <div class="h-64 relative"><canvas id="chartSimProg"></canvas></div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs">
            <h3 class="font-display font-bold text-slate-900 text-base mb-3">Progresso do Conteúdo Programático por Área (%)</h3>
            <div class="h-64 relative"><canvas id="chartAreaProg"></canvas></div>
          </div>
        </div>
      `;

      // Chart 1: Accuracy by Subject
      const nonRed = SUBJECTS.filter(s => s.id !== 'redacao');
      chartInstances.push(new Chart(document.getElementById('chartAccBySubj'), {
        type: 'bar',
        data: {
          labels: nonRed.map(s => s.name),
          datasets: [{
            label: '% de Acertos',
            data: nonRed.map(s => {
              const st = m.subjectStats[s.id];
              return st && st.total > 0 ? Math.round((st.correct / st.total) * 100) : 0;
            }),
            backgroundColor: '#10b981',
            borderRadius: 8
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } } }
      }));

      // Chart 2: Essay Evolution
      chartInstances.push(new Chart(document.getElementById('chartEssayProg'), {
        type: 'line',
        data: {
          labels: state.redacaoHistory.length ? state.redacaoHistory.map((_, i) => `Red #${i + 1}`) : ['Sem dados'],
          datasets: [{
            label: 'Nota (0-1000)',
            data: state.redacaoHistory.length ? state.redacaoHistory.map(r => r.total) : [0],
            borderColor: '#e11d48',
            backgroundColor: 'rgba(225,29,72,0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 1000 } } }
      }));

      // Chart 3: Simulados Evolution
      chartInstances.push(new Chart(document.getElementById('chartSimProg'), {
        type: 'line',
        data: {
          labels: state.simuladoLogs.length ? state.simuladoLogs.map((_, i) => `Sim #${i + 1}`) : ['Sem dados'],
          datasets: [{
            label: 'Total de Acertos',
            data: state.simuladoLogs.length ? state.simuladoLogs.map(s => (s.ling || 0) + (s.hum || 0) + (s.nat || 0) + (s.mat || 0)) : [0],
            borderColor: '#6366f1',
            backgroundColor: 'rgba(99,102,241,0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 180 } } }
      }));

      // Chart 4: Syllabus Progress by Area
      const areas = ['Linguagens', 'Humanas', 'Natureza', 'Matemática', 'Redação'];
      const areaPcts = areas.map(a => {
        const subjs = SUBJECTS.filter(s => s.area === a);
        let tot = 0, done = 0;
        subjs.forEach(s => {
          tot += s.topics.length;
          s.topics.forEach((_, idx) => { if (state.syllabusProgress[`${s.id}_${idx}`]?.done) done++; });
        });
        return tot > 0 ? Math.round((done / tot) * 100) : 0;
      });
      chartInstances.push(new Chart(document.getElementById('chartAreaProg'), {
        type: 'bar',
        data: {
          labels: areas,
          datasets: [{
            label: '% Concluído',
            data: areaPcts,
            backgroundColor: ['#8b5cf6', '#f59e0b', '#14b8a6', '#4f46e5', '#f43f5e'],
            borderRadius: 8
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } } }
      }));
    }

    function saveUepbTracker(e) {
      e.preventDefault();
      state.uepbTracker = {
        campus: document.getElementById('uepbCampus').value.trim(),
        modalidade: document.getElementById('uepbMod').value.trim(),
        notaCorteRef: document.getElementById('uepbCorte').value.trim(),
        editalStatus: document.getElementById('uepbEdital').value.trim(),
        observacoes: document.getElementById('uepbObs').value.trim()
      };
      saveState();
      showToast('Informações oficiais da UEPB salvas!');
    }

    function addGoal(e) {
      e.preventDefault();
      state.goals.unshift({
        id: `goal_${Date.now()}`,
        period: document.getElementById('goalPeriod').value,
        text: document.getElementById('goalText').value.trim(),
        done: false,
        createdAt: formatISO(new Date())
      });
      saveState();
      showToast('Meta adicionada!');
      renderCurrentPage();
    }

    function toggleGoal(id) {
      const g = state.goals.find(x => x.id === id);
      if (g) { g.done = !g.done; saveState(); renderCurrentPage(); }
    }

    function deleteGoal(id) {
      state.goals = state.goals.filter(x => x.id !== id);
      saveState();
      renderCurrentPage();
    }

    /* =========================================================================
       18. PÁGINA 11 — MATERIAIS, LINKS E BACKUP DE DADOS
       ========================================================================= */

            </a>
          </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

              </button>

    function addPersonalLink(e) {
      e.preventDefault();
      state.personalLinks.unshift({
        id: `pl_${Date.now()}`,
        title: document.getElementById('plTitle').value.trim(),
        category: document.getElementById('plCat').value,
        url: document.getElementById('plUrl').value.trim()
      });
      saveState();
      showToast('Link salvo na sua biblioteca!');
      renderCurrentPage();
    }

    function deletePersonalLink(id) {
      state.personalLinks = state.personalLinks.filter(x => x.id !== id);
      saveState();
      renderCurrentPage();
    }

    function exportBackupJson() {
      const dataStr = JSON.stringify(state, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `backup_psicologia_uepb_enem2027_${formatISO(new Date())}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Backup .json exportado com sucesso!');
    }

    function triggerImportBackup() {
      document.getElementById('importJsonInput').click();
    }

    document.getElementById('importJsonInput').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          state = { ...getDefaultState(), ...parsed };
          saveState();
          showToast('Backup restaurado com sucesso!');
          renderCurrentPage();
        } catch (err) {
          showToast('Arquivo inválido. Selecione um backup .json gerado pela plataforma.', 'error');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    function confirmResetAllData() {
      openConfirmModal(
        'Resetar todos os dados?',
        'Isso apagará todo o seu progresso salvo neste navegador (cronograma, questões, redações, simulados e revisões). Recomendamos exportar um backup antes. Deseja continuar?',
        () => {
          state = getDefaultState();
          saveState();
          showToast('Todos os dados foram zerados.', 'info');
          renderCurrentPage();
        },
        'Sim, zerar tudo',
        true
      );
    }

    /* =========================================================================
       19. INICIALIZAÇÃO
       ========================================================================= */
    renderSidebar();
    renderCurrentPage();
  </script>
