    function buildTeacherOptionsHtml(subjId, selectedId) {
      const matching = state.ferrettoTeachers.filter(t => (t.subjectIds || []).includes(subjId));
      const others = state.ferrettoTeachers.filter(t => !(t.subjectIds || []).includes(subjId));
      let html = `<option value="">Selecionar professor...</option>`;
      if (matching.length) {
        html += `<optgroup label="Professores desta disciplina">${matching.map(t => `<option value="${t.id}" ${t.id === selectedId ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('')}</optgroup>`;
      }
      if (others.length) {
        html += `<optgroup label="Outros professores">${others.map(t => `<option value="${t.id}" ${t.id === selectedId ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('')}</optgroup>`;
      }
      return html;
    }

    function buildModuleOptionsHtml(subjId, teacherId, selectedModId) {
      let mods = state.ferrettoModules.filter(m => m.subjectId === subjId);
      if (teacherId) {
        const byProf = mods.filter(m => m.teacherId === teacherId);
        if (byProf.length) mods = byProf;
      }
      mods.sort((a, b) => (a.order || 0) - (b.order || 0));
      let html = `<option value="">Selecionar módulo...</option>`;
      html += mods.map(m => `<option value="${m.id}" ${m.id === selectedModId ? 'selected' : ''}>${escapeHtml(m.title)}</option>`).join('');
      return html;
    }

    function buildLessonOptionsHtml(subjId, modId, selectedLesId) {
      let lessons = modId
        ? state.ferrettoLessons.filter(l => l.moduleId === modId)
        : state.ferrettoLessons.filter(l => l.subjectId === subjId);
      lessons.sort((a, b) => (a.order || 0) - (b.order || 0));
      let html = `<option value="">Digitar manualmente ou escolher aula...</option>`;
      html += lessons.map(l => `<option value="${l.id}" ${l.id === selectedLesId ? 'selected' : ''}>${l.done ? '✓ ' : ''}${escapeHtml(l.title)}</option>`).join('');
      return html;
    }

    function refreshActivityCascades() {
      const subjId = document.getElementById('faSubj')?.value;
      const tEl = document.getElementById('faTeacher');
      if (tEl) tEl.innerHTML = buildTeacherOptionsHtml(subjId, '');
      refreshActivityModules();
    }

    function refreshActivityModules() {
      const subjId = document.getElementById('faSubj')?.value;
      const tId = document.getElementById('faTeacher')?.value || '';
      const mEl = document.getElementById('faModule');
      if (mEl) mEl.innerHTML = buildModuleOptionsHtml(subjId, tId, '');
      refreshActivityLessons();
    }

    function refreshActivityLessons() {
      const subjId = document.getElementById('faSubj')?.value;
      const mId = document.getElementById('faModule')?.value || '';
      const lEl = document.getElementById('faLesson');
      if (lEl) lEl.innerHTML = buildLessonOptionsHtml(subjId, mId, '');
    }

    function onSelectActivityLesson() {
      const lId = document.getElementById('faLesson')?.value;
      if (!lId) return;
      const les = getLessonById(lId);
      if (les) {
        const titleEl = document.getElementById('faCustomTitle');
        const durEl = document.getElementById('faDuration');
        if (titleEl) titleEl.value = les.title;
        if (durEl && les.duration) durEl.value = les.duration;
      }
    }

    function openNewFerrettoActivityForm() { editingActivityId = null; showFerrettoActivityForm = true; renderCurrentPage(); }
    function editFerrettoActivity(id) { editingActivityId = id; showFerrettoActivityForm = true; renderCurrentPage(); }
    function closeFerrettoActivityForm() { editingActivityId = null; showFerrettoActivityForm = false; renderCurrentPage(); }

    function submitFerrettoActivity(e, dateIso) {
      e.preventDefault();
      const subjectId = document.getElementById('faSubj').value;
      const teacherId = document.getElementById('faTeacher').value;
      const moduleId = document.getElementById('faModule').value;
      let lessonId = document.getElementById('faLesson').value;
      const customLessonTitle = document.getElementById('faCustomTitle').value.trim();
      const duration = Number(document.getElementById('faDuration').value) || 0;
      const notes = document.getElementById('faNotes').value.trim();
      const createIfNew = document.getElementById('faCreateLessonIfNew')?.checked;

      if (!lessonId && !customLessonTitle) {
        showToast('Selecione uma aula cadastrada ou digite o conteúdo que será estudado.', 'error');
        return;
      }

      if (!lessonId && customLessonTitle && moduleId && createIfNew) {
        const newLes = {
          id: `aula_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          subjectId,
          moduleId,
          teacherId,
          title: customLessonTitle,
          content: '',
          duration,
          link: '',
          notes: '',
          materials: '',
          exercises: '',
          exercisesDone: false,
          needsReview: false,
          done: false,
          completedAt: null,
          order: state.ferrettoLessons.filter(l => l.moduleId === moduleId).length
        };
        state.ferrettoLessons.push(newLes);
        lessonId = newLes.id;
      }

      const linkedLes = lessonId ? getLessonById(lessonId) : null;

      if (editingActivityId) {
        const act = state.ferrettoScheduleActivities.find(a => a.id === editingActivityId);
        if (act) {
          act.subjectId = subjectId;
          act.teacherId = teacherId;
          act.moduleId = moduleId;
          act.lessonId = lessonId;
          act.customLessonTitle = customLessonTitle || (linkedLes ? linkedLes.title : '');
          act.duration = duration;
          act.notes = notes;
        }
        showToast('Atividade do cronograma atualizada!');
      } else {
        state.ferrettoScheduleActivities.push({
          id: `fact_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          date: dateIso,
          subjectId,
          teacherId,
          moduleId,
          lessonId,
          customLessonTitle: customLessonTitle || (linkedLes ? linkedLes.title : ''),
          duration,
          done: linkedLes ? linkedLes.done : false,
          completedAt: linkedLes ? linkedLes.completedAt : null,
          notes
        });
        showToast('Aula do Ferretto adicionada ao cronograma!');
      }

      showFerrettoActivityForm = false;
      editingActivityId = null;
      saveState();
      renderCurrentPage();
    }

    function toggleFerrettoActivityDone(actId) {
      const act = state.ferrettoScheduleActivities.find(a => a.id === actId);
      if (!act) return;
      const next = !act.done;
      act.done = next;
      act.completedAt = next ? formatISO(new Date()) : null;

      // Sync automatically with the linked Ferretto lesson in Disciplinas
      if (act.lessonId) {
        const les = getLessonById(act.lessonId);
        if (les) {
          les.done = next;
          les.completedAt = act.completedAt;
        }
      }

      if (next) {
        const title = act.lessonId ? (getLessonById(act.lessonId)?.title || act.customLessonTitle) : act.customLessonTitle;
        scheduleSpacedReviews(`fact_${act.id}`, act.subjectId, title || 'Aula Ferretto', act.date);
        showToast('Aula concluída! Status atualizado na disciplina e no progresso geral.');
      }
      saveState();
      renderCurrentPage();
    }

    function deleteFerrettoActivity(actId) {
      state.ferrettoScheduleActivities = state.ferrettoScheduleActivities.filter(a => a.id !== actId);
      saveState();
      showToast('Atividade removida do cronograma.', 'info');
      renderCurrentPage();
    }

    function renderTaskFerrettoLinkBar(task) {
      if (task.subjectId === 'revisao' || task.subjectId === 'simulado') return '';
      const link = state.taskFerrettoLinks[task.id] || {};
      const subjLessons = state.ferrettoLessons.filter(l => l.subjectId === task.subjectId);
      if (subjLessons.length === 0) return '';
      const linkedLes = link.lessonId ? getLessonById(link.lessonId) : null;
      const linkedProf = linkedLes ? getTeacherById(linkedLes.teacherId) : null;

      return `
        <div class="mt-3 pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 text-xs">
          <div class="flex items-center gap-2 text-teal-800 font-semibold">
            <i data-lucide="link-2" class="w-3.5 h-3.5 text-teal-600"></i>
            <span>Vincular a uma aula do Ferretto:</span>
          </div>
          <select onchange="setTaskFerrettoLink('${task.id}', this.value)" class="bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1 text-xs font-semibold text-slate-700 max-w-xs">
            <option value="">Sem vínculo direto</option>
            ${subjLessons.map(l => {
              const p = getTeacherById(l.teacherId);
              return `<option value="${l.id}" ${link.lessonId === l.id ? 'selected' : ''}>${escapeHtml(l.title)}${p ? ` (${escapeHtml(p.name)})` : ''}</option>`;
            }).join('')}
          </select>
          ${linkedLes ? `<span class="text-[11px] font-bold text-emerald-700">✓ Sincronizado${linkedProf ? ` • Prof. ${escapeHtml(linkedProf.name)}` : ''}</span>` : ''}
        </div>
      `;
    }

    function setTaskFerrettoLink(taskId, lessonId) {
      if (!lessonId) {
        delete state.taskFerrettoLinks[taskId];
      } else {
        const les = getLessonById(lessonId);
        state.taskFerrettoLinks[taskId] = {
          lessonId,
          moduleId: les ? les.moduleId : '',
          teacherId: les ? les.teacherId : ''
        };
      }
      saveState();
      showToast(lessonId ? 'Bloco vinculado à aula do Ferretto!' : 'Vínculo removido.', 'info');
      renderCurrentPage();
    }

    /* -------------------------------------------------------------------------
       D. CONTROLE DE PROGRESSO FERRETTO (PAINEL CLARO E ACOLHEDOR)
       ------------------------------------------------------------------------- */
    function renderFerrettoProgressPanel(m) {
      const todayIso = formatISO(new Date());

      // Overdue Ferretto schedule activities (before today and not done)
      const overdueActs = state.ferrettoScheduleActivities
        .filter(a => !a.done && a.date < todayIso)
        .sort((a, b) => a.date.localeCompare(b.date));

      // Items needing review: pending spaced reviews + Ferretto lessons flagged needsReview
      const flaggedLessons = state.ferrettoLessons.filter(l => l.needsReview);
      const pendingSpaced = state.reviews.filter(r => !r.done).sort((a, b) => a.dueDate.localeCompare(b.dueDate));

      // Study History (completed Ferretto lessons & completed Ferretto activities)
      const historyItems = [];
      state.ferrettoLessons.filter(l => l.done).forEach(l => {
        const prof = getTeacherById(l.teacherId);
        const mod = getModuleById(l.moduleId);
        historyItems.push({
          date: l.completedAt || todayIso,
          subjectId: l.subjectId,
          title: l.title,
          meta: `${prof ? 'Prof. ' + prof.name : 'Ferretto'}${mod ? ' • ' + mod.title : ''}`,
          duration: l.duration || 0
        });
      });
      state.ferrettoScheduleActivities.filter(a => a.done && !a.lessonId).forEach(a => {
        const prof = getTeacherById(a.teacherId);
        historyItems.push({
          date: a.completedAt || a.date,
          subjectId: a.subjectId,
          title: a.customLessonTitle || 'Atividade Ferretto',
          meta: prof ? 'Prof. ' + prof.name : 'Cronograma Ferretto',
          duration: a.duration || 0
        });
      });
      historyItems.sort((a, b) => b.date.localeCompare(a.date));

      return `
        <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-xs mb-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-100 mb-5">
            <div>
              <h3 class="font-display font-extrabold text-slate-900 text-lg flex items-center gap-2">
                <i data-lucide="graduation-cap" class="w-5 h-5 text-teal-600"></i>
                <span>Controle de Progresso — Cursinho Ferretto</span>
              </h3>
              <p class="text-xs text-slate-500 mt-0.5">Acompanhe seu avanço com clareza e leveza. Cada aula concluída conta — sem cobrança excessiva.</p>
            </div>
            <div class="flex flex-wrap gap-2 text-xs font-bold">
              <span class="px-3 py-1.5 rounded-xl bg-emerald-50 text-emerald-800 border border-emerald-200">Progresso Ferretto: ${m.ferrettoPct}%</span>
              <span class="px-3 py-1.5 rounded-xl bg-teal-50 text-teal-800 border border-teal-200">${m.ferrettoDoneLessons} concluídas • ${m.ferrettoPendingLessons} pendentes</span>
            </div>
          </div>

          <!-- 12 Disciplines Progress Bars -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 mb-6">
            ${FERRETTO_SUBJECTS.map(s => {
              const all = state.ferrettoLessons.filter(l => l.subjectId === s.id);
              const done = all.filter(l => l.done).length;
              const pend = all.length - done;
              const pct = all.length > 0 ? Math.round((done / all.length) * 100) : 0;
              return `
                <button onclick="openSubjectInFerretto('${s.id}')" class="text-left p-3.5 rounded-2xl bg-slate-50/80 hover:bg-emerald-50/40 border border-slate-200 hover:border-emerald-300 transition">
                  <div class="flex items-center justify-between mb-1.5">
                    <span class="text-xs font-extrabold text-slate-800">${s.name}</span>
                    <span class="text-xs font-bold text-emerald-700">${pct}%</span>
                  </div>
                  <div class="w-full h-2 bg-slate-200 rounded-full overflow-hidden mb-1.5">
                    <div class="h-full bg-gradient-to-r from-emerald-500 to-teal-500 rounded-full transition-all" style="width:${pct}%"></div>
                  </div>
                  <p class="text-[11px] text-slate-500">${done} concluída(s) • ${pend} pendente(s)</p>
                </button>
              `;
            }).join('')}
          </div>

          <!-- 3 Supportive Columns: History, Overdue (Gentle), Needs Review -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <!-- Study History -->
            <div class="bg-slate-50/80 rounded-2xl border border-slate-200 p-4">
              <h4 class="font-display font-bold text-slate-900 text-sm mb-3 flex items-center gap-2">
                <i data-lucide="history" class="w-4 h-4 text-emerald-600"></i> Histórico de Estudos (${historyItems.length})
              </h4>
              ${historyItems.length === 0 ? `
                <p class="text-xs text-slate-500 leading-relaxed">Seu histórico aparecerá aqui conforme você concluir suas aulas do Ferretto.</p>
              ` : `
                <div class="space-y-2 max-h-56 overflow-y-auto pr-1">
                  ${historyItems.slice(0, 12).map(h => `
                    <div class="p-2.5 rounded-xl bg-white border border-slate-100">
                      <div class="flex items-center justify-between text-[10px] font-bold text-slate-400">
                        <span class="text-emerald-700">${SUBJECT_MAP[h.subjectId]?.name || h.subjectId}</span>
                        <span>${formatBR(h.date)}</span>
                      </div>
                      <p class="text-xs font-bold text-slate-800 truncate mt-0.5">${escapeHtml(h.title)}</p>
                      <p class="text-[11px] text-slate-500 truncate">${escapeHtml(h.meta)}${h.duration ? ` • ${h.duration} min` : ''}</p>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>

            <!-- Overdue Contents (Supportive / Gentle) -->
            <div class="bg-amber-50/40 rounded-2xl border border-amber-200/80 p-4">
              <h4 class="font-display font-bold text-slate-900 text-sm mb-1 flex items-center gap-2">
                <i data-lucide="calendar-clock" class="w-4 h-4 text-amber-600"></i> Conteúdos Atrasados (${overdueActs.length})
              </h4>
              <p class="text-[11px] text-slate-500 mb-3">Imprevistos acontecem! Reagende para hoje ou conclua no seu ritmo.</p>
              ${overdueActs.length === 0 ? `
                <p class="text-xs text-emerald-800 bg-emerald-50/70 border border-emerald-100 rounded-xl p-3">Tudo em dia por aqui! Nenhuma aula atrasada no cronograma.</p>
              ` : `
                <div class="space-y-2 max-h-52 overflow-y-auto pr-1">
                  ${overdueActs.map(a => {
                    const les = a.lessonId ? getLessonById(a.lessonId) : null;
                    const title = les ? les.title : (a.customLessonTitle || 'Aula Ferretto');
                    return `
                      <div class="p-2.5 rounded-xl bg-white border border-amber-100">
                        <div class="flex items-center justify-between text-[10px] font-bold">
                          <span class="text-amber-700">${SUBJECT_MAP[a.subjectId]?.name || a.subjectId}</span>
                          <span class="text-slate-400">Previsto: ${formatBR(a.date)}</span>
                        </div>
                        <p class="text-xs font-bold text-slate-800 truncate mt-0.5">${escapeHtml(title)}</p>
                        <div class="flex items-center gap-1.5 mt-2">
                          <button onclick="rescheduleFerrettoActivityToday('${a.id}')" class="px-2 py-1 rounded-lg bg-amber-100 hover:bg-amber-200 text-amber-900 text-[11px] font-bold">Reagendar p/ Hoje</button>
                          <button onclick="toggleFerrettoActivityDone('${a.id}')" class="px-2 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold">Concluir</button>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>

            <!-- Contents Needing Review -->
            <div class="bg-teal-50/40 rounded-2xl border border-teal-200/80 p-4">
              <h4 class="font-display font-bold text-slate-900 text-sm mb-3 flex items-center gap-2">
                <i data-lucide="repeat" class="w-4 h-4 text-teal-600"></i> Precisam de Revisão (${flaggedLessons.length + pendingSpaced.length})
              </h4>
              ${(flaggedLessons.length === 0 && pendingSpaced.length === 0) ? `
                <p class="text-xs text-slate-500 bg-white/80 rounded-xl p-3">Nenhum conteúdo aguardando revisão no momento.</p>
              ` : `
                <div class="space-y-2 max-h-56 overflow-y-auto pr-1">
                  ${flaggedLessons.map(l => `
                    <div class="p-2.5 rounded-xl bg-white border border-teal-100 flex items-center justify-between gap-2">
                      <div class="min-w-0">
                        <span class="text-[10px] font-bold text-amber-700">Aula Ferretto • ${SUBJECT_MAP[l.subjectId]?.name || ''}</span>
                        <p class="text-xs font-bold text-slate-800 truncate">${escapeHtml(l.title)}</p>
                      </div>
                      <button onclick="toggleFerrettoLessonReview('${l.id}')" class="px-2 py-1 rounded-lg bg-teal-600 text-white text-[11px] font-bold shrink-0">Revisada ✓</button>
                    </div>
                  `).join('')}
                  ${pendingSpaced.slice(0, 8).map(r => `
                    <div class="p-2.5 rounded-xl bg-white border border-teal-100 flex items-center justify-between gap-2">
                      <div class="min-w-0">
                        <span class="text-[10px] font-bold text-teal-700">[${r.type}] ${formatBR(r.dueDate)} • ${SUBJECT_MAP[r.subjectId]?.name || ''}</span>
                        <p class="text-xs font-bold text-slate-800 truncate">${escapeHtml(r.topic)}</p>
                      </div>
                      <button onclick="completeReview('${r.id}')" class="px-2 py-1 rounded-lg bg-emerald-600 text-white text-[11px] font-bold shrink-0">OK</button>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function rescheduleFerrettoActivityToday(actId) {
      const act = state.ferrettoScheduleActivities.find(a => a.id === actId);
      if (!act) return;
      act.date = getDefaultActiveDate();
      saveState();
      showToast(`Aula reagendada para ${formatBR(act.date)}!`);
      renderCurrentPage();
    }


    function renderBlockTeacherMiniSelect(taskId, subjId, selectedTeacherId) {
      const matching = state.ferrettoTeachers.filter(t => (t.subjectIds || []).includes(subjId));
      const others = state.ferrettoTeachers.filter(t => !(t.subjectIds || []).includes(subjId));
      if (matching.length === 0 && others.length === 0) return '';
      const autoSel = selectedTeacherId || (matching.length === 1 ? matching[0].id : '');
      return `
        <select onchange="updateTaskField('${taskId}', 'teacherId', this.value); renderCurrentPage();" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-0.5 text-[11px] font-semibold text-teal-800 focus:outline-none focus:ring-1 focus:ring-teal-500" title="Escolher professor ou plataforma para esta atividade">
          ${matching.length > 1 ? `<option value="" ${!autoSel ? 'selected' : ''}>Escolher prof./plat...</option>` : ''}
          ${matching.map(t => `<option value="${t.id}" ${autoSel === t.id ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('')}
          ${others.length ? `<optgroup label="Outros">${others.map(t => `<option value="${t.id}" ${autoSel === t.id ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('')}</optgroup>` : ''}
        </select>
      `;
    }

    /* =========================================================================
       19. INICIALIZAÇÃO
       ========================================================================= */
    renderSidebar();
    renderCurrentPage();
  </script>
</body>
</html>
