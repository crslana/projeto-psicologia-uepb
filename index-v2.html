    function parseISO(str) {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatISO(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatBR(isoStr) {
      if (!isoStr) return '—';
      const [y, m, d] = isoStr.split('-');
      return `${d}/${m}/${y}`;
    }

    function addDays(isoStr, days) {
      const d = parseISO(isoStr);
      d.setDate(d.getDate() + days);
      return formatISO(d);
    }

    function getPhaseByDate(isoStr) {
      for (const p of PHASES) {
        if (isoStr >= p.start && isoStr <= p.end) return p;
      }
      return PHASES[0];
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')

    function generateFullYearSchedule() {
      // Cursors to advance pedagogically through every subject's syllabus
      const cursors = {};

      function nextTopic(subjId, phase) {
        const subj = SUBJECT_MAP[subjId];
        const idx = cursors[subjId]++;
        if (phase.id <= 3) {
          const cycle = Math.floor(idx / subj.topics.length);
          const topic = subj.topics[idx % subj.topics.length];
          if (cycle === 0) return { topic, stage: 'Fundamento e Teoria' };
          if (cycle === 1) return { topic, stage: 'Aprofundamento e Interpretação' };
          return { topic, stage: 'Questões Difíceis e Aplicações ENEM' };
        } else if (phase.id === 4) {
          const hy = highYield[subjId] || subj.topics;
          return { topic: hy[idx % hy.length], stage: 'Revisão Dirigida de Alta Incidência ENEM' };
        } else {
          const hy = highYield[subjId] || subj.topics;
          return { topic: hy[idx % hy.length], stage: 'Revisão Final Leve & Caderno de Erros' };
        }
      }

      function makeStudyTask(dateIso, slotIdx, subjId, phase) {
        const subj = SUBJECT_MAP[subjId];
        const { topic, stage } = nextTopic(subjId, phase);
        const q = phase.qDist;
        const activities = {
          1: `Montar resumo estruturado com conceitos-chave de "${topic}" e resolver as questões analisando cada alternativa.`,

          5: `Revisão ativa de 15 min sem consultar o caderno sobre "${topic}" + refazer erros antigos desse tema.`

          2: `Consolidar a interpretação e resolução autônoma de problemas envolvendo ${topic}.`,
          3: `Aumentar precisão e velocidade em ${topic}, focando nos detalhes mais cobrados pela banca do ENEM.`,
          4: `Blindar acertos em ${topic} usando provas anteriores oficiais do INEP e controle rigoroso de tempo.`,
          5: `Reforçar a memória de longo prazo em ${topic} com leveza, confiança e sem sobrecarga.`
        };
        const reviewNote = phase.id === 5
          ? `Revisar erros registrados no Caderno de Erros de ${subj.name} e descansar a mente após o bloco.`
          : `Revisão espaçada automática (24h, 7d e 30d) + recuperação ativa de 5 min ao final da sessão.`;

        return {
          id: `${dateIso}_${slotIdx}`,
          date: dateIso,
          subjectId: subjId,
          subjectName: subj.name,
          channel: subj.channel,
          topic: `${topic} (${stage})`,
          rawTopic: topic,
          objective: objectives[phase.id],
          ytQuery: `${subj.channel} ${topic} ENEM`,
          questions: { ...q },
          activity: activities[phase.id],
          review: reviewNote,
          type: 'estudo'

    function ensureDefaultTeachersAndAssociations(st) {
      if (!Array.isArray(st.ferrettoTeachers)) st.ferrettoTeachers = [];
      if (!Array.isArray(st.dismissedSeedTeacherIds)) st.dismissedSeedTeacherIds = [];
      let changed = false;

      DEFAULT_SEED_TEACHERS.forEach(seed => {
        if (st.dismissedSeedTeacherIds.includes(seed.id)) return;
        const existingById = st.ferrettoTeachers.find(t => t.id === seed.id);
        const existingByName = st.ferrettoTeachers.find(t => t.name && t.name.trim().toLowerCase() === seed.name.trim().toLowerCase());
        const existing = existingById || existingByName;
        if (!existing) {
          st.ferrettoTeachers.push({
            ...seed,
            subjectIds: [...seed.subjectIds],
            createdAt: formatISO(new Date())
          });
          changed = true;
        } else {
          // Non-destructively ensure required subjects are associated without removing user's custom subjects
          if (!Array.isArray(existing.subjectIds)) existing.subjectIds = [];
          seed.subjectIds.forEach(sid => {
            if (!existing.subjectIds.includes(sid)) {
              existing.subjectIds.push(sid);
              changed = true;
            }
          });
        }
      });
      return changed;
    }

    function loadState() {
      let loaded;
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          loaded = getDefaultState();
        } else {
          const parsed = JSON.parse(raw);
          const def = getDefaultState();
          loaded = {
            ...def,
            ...parsed,
            uepbTracker: { ...def.uepbTracker, ...(parsed.uepbTracker || {}) },
            ferrettoTeachers: Array.isArray(parsed.ferrettoTeachers) ? parsed.ferrettoTeachers : [],
            ferrettoModules: Array.isArray(parsed.ferrettoModules) ? parsed.ferrettoModules : [],
            ferrettoLessons: Array.isArray(parsed.ferrettoLessons) ? parsed.ferrettoLessons : [],
            ferrettoSubjectExtras: parsed.ferrettoSubjectExtras || {},
            ferrettoScheduleActivities: Array.isArray(parsed.ferrettoScheduleActivities) ? parsed.ferrettoScheduleActivities : [],
            taskFerrettoLinks: parsed.taskFerrettoLinks || {},
            dismissedSeedTeacherIds: Array.isArray(parsed.dismissedSeedTeacherIds) ? parsed.dismissedSeedTeacherIds : []
          };
        }
      } catch (e) {
        loaded = getDefaultState();
      }
      const seededNow = ensureDefaultTeachersAndAssociations(loaded);
      if (seededNow) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(loaded)); } catch (_) {}

      return loaded;
    }

    /* =========================================================================
       5. CÁLCULO REAL DE INDICADORES (INICIANDO ESTRITAMENTE ZERADOS)
       ========================================================================= */
    function computeMetrics() {
      const totalTasks = SCHEDULE_LIST.reduce((acc, d) => acc + d.tasks.length, 0);
      let completedTasksCount = 0;
      let videosWatched = 0;
      let totalMinutes = 0;

      Object.values(state.taskProgress).forEach(tp => {
        if (tp.done) completedTasksCount++;
        if (tp.videoDone) videosWatched++;
        if (tp.minutes && Number(tp.minutes) > 0) totalMinutes += Number(tp.minutes);
      });

      // Add redacao lessons completed as videoaulas if marked done
      const redacaoLessonsDone = Object.values(state.redacaoLessons).filter(l => l.done).length;
      videosWatched += redacaoLessonsDone;

      // Ferretto metrics (lessons + unlinked schedule activities, avoiding double-counting)
      const ferrettoTotalLessons = state.ferrettoLessons.length;
      const ferrettoDoneLessons = state.ferrettoLessons.filter(l => l.done).length;
      const ferrettoPendingLessons = ferrettoTotalLessons - ferrettoDoneLessons;
      const ferrettoPct = ferrettoTotalLessons > 0 ? Math.round((ferrettoDoneLessons / ferrettoTotalLessons) * 1000) / 10 : 0;

      videosWatched += ferrettoDoneLessons;
      state.ferrettoLessons.forEach(l => {
        if (l.done && Number(l.duration) > 0) totalMinutes += Number(l.duration);
      });
      state.ferrettoScheduleActivities.forEach(a => {
        if (a.done && !a.lessonId) {
          videosWatched += 1;
          if (Number(a.duration) > 0) totalMinutes += Number(a.duration);
        }
      });

      // Question logs
      let qTotal = 0;
      let qCorrect = 0;
      const subjectStats = {};
      SUBJECTS.forEach(s => { subjectStats[s.id] = { total: 0, correct: 0 }; });

      state.questionLogs.forEach(log => {
        const t = Number(log.total) || 0;
        const c = Number(log.correct) || 0;
        qTotal += t;
        qCorrect += c;
        totalMinutes += Number(log.minutes) || 0;
        if (subjectStats[log.subjectId]) {
          subjectStats[log.subjectId].total += t;
          subjectStats[log.subjectId].correct += c;
        }
      });

      // Essays
      const essaysCount = state.redacaoHistory.length;
      const essayAvg = essaysCount > 0
        ? Math.round(state.redacaoHistory.reduce((a, r) => a + (Number(r.total) || 0), 0) / essaysCount)
        : 0;
      state.redacaoHistory.forEach(r => { totalMinutes += Number(r.minutes) || 0; });

      // Simulados
      const simuladosCount = state.simuladoLogs.length;
      state.simuladoLogs.forEach(s => { totalMinutes += Number(s.minutes) || 0; });

      const schedulePct = totalTasks > 0 ? Math.round((completedTasksCount / totalTasks) * 1000) / 10 : 0;
      const accuracyPct = qTotal > 0 ? Math.round((qCorrect / qTotal) * 1000) / 10 : 0;
      const hoursStudied = Math.round((totalMinutes / 60) * 10) / 10;

      const combinedTotal = totalTasks + ferrettoTotalLessons;
      const combinedDone = completedTasksCount + ferrettoDoneLessons;
      const combinedPct = combinedTotal > 0 ? Math.round((combinedDone / combinedTotal) * 1000) / 10 : 0;

      return {
        totalTasks,
        completedTasksCount,
        schedulePct,
        ferrettoTotalLessons,
        ferrettoDoneLessons,
        ferrettoPendingLessons,
        ferrettoPct,
        combinedPct,
        hoursStudied,
        totalMinutes,
        videosWatched,
        qTotal,
        qCorrect,
        accuracyPct,
        essaysCount,
        essayAvg,
        simuladosCount,
        subjectStats
      };
    }

    function scheduleSpacedReviews(sourceKey, subjectId, topic, baseDateIso) {
      const intervals = [
        { type: '24h', days: 1 },
        { type: '7d', days: 7 },
        { type: '30d', days: 30 }
      ];
      let added = 0;
      intervals.forEach(iv => {
        const exists = state.reviews.some(r => r.sourceKey === sourceKey && r.type === iv.type);
        if (!exists) {
          state.reviews.push({
            id: `rev_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
            sourceKey,
            subjectId,
            topic,
            type: iv.type,
            dueDate: addDays(baseDateIso, iv.days),
            done: false,
            createdAt: baseDateIso
          });
          added++;
        }
      });
      return added;
    }

                </p>

                  ${pendingReviews.slice(0, 5).map(r => `
                    <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-teal-50/60 border border-teal-100">

                        <span class="text-[10px] font-bold uppercase text-teal-700">${r.type} • ${formatBR(r.dueDate)}</span>

    function kpiCard(title, value, sub, icon, color) {
      const palette = {
        emerald: 'bg-emerald-50 text-emerald-700',
        teal: 'bg-teal-50 text-teal-700',
        indigo: 'bg-indigo-50 text-indigo-700',
        amber: 'bg-amber-50 text-amber-700',
        rose: 'bg-rose-50 text-rose-700',
        violet: 'bg-violet-50 text-violet-700'
      };
      return `
        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-semibold text-slate-500">${title}</span>
            <div class="w-8 h-8 rounded-xl ${palette[color]} flex items-center justify-center">
              <i data-lucide="${icon}" class="w-4 h-4"></i>
            </div>
          </div>
          <p class="font-display text-2xl font-extrabold text-slate-900">${value}</p>
          <p class="text-[11px] text-slate-500 mt-0.5 truncate">${sub}</p>
        </div>
      `;
    }

    function updateEnemDate() {
      const val = document.getElementById('enemDateInput')?.value;
      if (!val) return;
      state.enemDate = val;
      state.enemDateOfficial = true;
      saveState();
      showToast(`Data do ENEM 2027 atualizada para ${formatBR(val)}.`);
      renderCurrentPage();
    }

    /* =========================================================================
       9. PÁGINA 2 — MEU CRONOGRAMA (365 DIAS COMPLETOS)
       ========================================================================= */
    function renderCronograma(container) {
      const day = SCHEDULE_MAP[selectedCronogramaDate] || SCHEDULE_LIST[0];
      const currentMonthKey = day.date.slice(0, 7);
      const months = getMonthList();

      // Build week strip around selected day (Mon..Sun)
      const dObj = parseISO(day.date);
      const dow = dObj.getDay();
      const diffToMon = dow === 0 ? -6 : 1 - dow;
      const monDate = new Date(dObj);
      monDate.setDate(dObj.getDate() + diffToMon);

      const weekDays = [];
      for (let i = 0; i < 7; i++) {
        const wd = new Date(monDate);
        wd.setDate(monDate.getDate() + i);
        const iso = formatISO(wd);
        weekDays.push({ iso, inPlan: Boolean(SCHEDULE_MAP[iso]), dow: wd.getDay(), dayNum: wd.getDate() });
      }

      const dayFerrettoActs = state.ferrettoScheduleActivities.filter(a => a.date === day.date);
      const dayDoneCount = day.tasks.filter(t => state.taskProgress[t.id]?.done).length + dayFerrettoActs.filter(a => a.done).length;
      const dayTotalCount = day.tasks.length + dayFerrettoActs.length;

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
          <div>
            <h2 class="font-display text-2xl font-extrabold text-slate-900">Meu Cronograma Diário</h2>
            <p class="text-sm text-slate-500">Planejamento completo de 365 dias (01/12/2026 a 30/11/2027) em ordem pedagógica.</p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <select onchange="jumpToMonth(this.value)" class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500">
              ${months.map(m => `<option value="${m.key}" ${m.key === currentMonthKey ? 'selected' : ''}>${m.label}</option>`).join('')}
            </select>
            <input type="date" min="${PLAN_START}" max="${PLAN_END}" value="${day.date}" onchange="selectScheduleDate(this.value)" class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
            <button onclick="selectScheduleDate(getDefaultActiveDate())" class="px-3.5 py-2 rounded-xl bg-emerald-50 text-emerald-800 border border-emerald-200 text-sm font-semibold hover:bg-emerald-100 transition">
              Hoje / Início
            </button>
          </div>
        </div>

        <!-- Week Strip Navigator -->
        <div class="bg-white rounded-2xl border border-slate-200 p-4 mb-6 shadow-xs">
          <div class="flex items-center justify-between mb-3">
            <button onclick="shiftScheduleDays(-7)" class="p-2 rounded-xl hover:bg-slate-100 text-slate-600 transition flex items-center gap-1 text-xs font-semibold">
              <i data-lucide="chevron-left" class="w-4 h-4"></i> Semana Anterior
            </button>
            <div class="text-center">
              <span class="text-xs font-bold px-2.5 py-0.5 rounded-full border ${day.phase.badge}">${day.phase.name}</span>
              <p class="text-xs text-slate-500 mt-1">Semana ${day.weekIndex} de 52 • Dia ${day.dayNum} de 365</p>
            </div>
            <button onclick="shiftScheduleDays(7)" class="p-2 rounded-xl hover:bg-slate-100 text-slate-600 transition flex items-center gap-1 text-xs font-semibold">
              Próxima Semana <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="grid grid-cols-7 gap-1.5 sm:gap-2">
            ${weekDays.map(wd => {
              const isSelected = wd.iso === day.date;
              const sched = SCHEDULE_MAP[wd.iso];
              const allDone = sched && sched.tasks.every(t => state.taskProgress[t.id]?.done);
              const someDone = sched && sched.tasks.some(t => state.taskProgress[t.id]?.done);
              return `
                <button ${wd.inPlan ? `onclick="selectScheduleDate('${wd.iso}')"` : 'disabled'} class="flex flex-col items-center py-2.5 px-1 rounded-xl border transition ${
                  !wd.inPlan
                    ? 'bg-slate-50 border-slate-100 text-slate-300 cursor-not-allowed'
                    : isSelected
                      ? 'bg-emerald-600 border-emerald-600 text-white shadow-sm'
                      : 'bg-white border-slate-200 hover:border-emerald-300 text-slate-700'
                }">
                  <span class="text-[11px] font-medium ${isSelected ? 'text-emerald-100' : 'text-slate-400'}">${WEEKDAY_SHORT[wd.dow]}</span>
                  <span class="font-display text-base font-bold mt-0.5">${wd.dayNum}</span>
                  <span class="w-1.5 h-1.5 rounded-full mt-1 ${
                    !wd.inPlan ? 'bg-transparent' : allDone ? (isSelected ? 'bg-white' : 'bg-emerald-500') : someDone ? 'bg-amber-400' : 'bg-slate-200'
                  }"></span>
                </button>
              `;
            }).join('')}
          </div>
        </div>

        <!-- Day Header -->
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
          <div class="flex items-center gap-3">
            <button onclick="shiftScheduleDays(-1)" class="p-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-600">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <div>
              <h3 class="font-display text-xl font-bold text-slate-900">${WEEKDAY_NAMES[day.dow]}, ${formatBR(day.date)}</h3>
              <p class="text-xs text-slate-500">${dayDoneCount} de ${dayTotalCount} sessões concluídas hoje (${dayFerrettoActs.length} do Ferretto)</p>
            </div>
            <button onclick="shiftScheduleDays(1)" class="p-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-600">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="text-xs text-slate-600 bg-white border border-slate-200 rounded-xl px-3.5 py-2">
            <strong>Meta da fase:</strong> ${day.phase.questionTarget}
          </div>
        </div>

        <!-- Ferretto Integrated Activities Section for Selected Day -->
        ${renderCronogramaFerrettoSection(day.date, dayFerrettoActs)}

        <!-- Detailed Task Cards (Base Annual Plan) -->
        <div class="flex items-center justify-between mb-3 mt-6">
          <h4 class="font-display font-bold text-slate-800 text-sm uppercase tracking-wider flex items-center gap-2">
            <i data-lucide="calendar-check" class="w-4 h-4 text-emerald-600"></i>
            <span>Blocos do Plano Base do Dia</span>
          </h4>
        </div>
        <div class="space-y-4">
          ${day.tasks.map((t, idx) => {
            const tp = state.taskProgress[t.id] || { done: false, videoDone: false, link: '', minutes: '' };
            const subj = SUBJECT_MAP[t.subjectId];
            const badgeClass = subj ? subj.badge : 'bg-slate-100 text-slate-800';
            return `
              <div class="bg-white rounded-2xl border ${tp.done ? 'border-emerald-300 ring-1 ring-emerald-100' : 'border-slate-200'} p-5 shadow-xs transition">
                <div class="flex flex-col md:flex-row md:items-start justify-between gap-4">
                  <div class="flex items-start gap-3.5 flex-1">
                    <input type="checkbox" ${tp.done ? 'checked' : ''} onchange="toggleTaskDone('${t.id}', '${day.date}', '${t.subjectId}', '${escapeHtml(t.rawTopic)}')" class="mt-1 w-5 h-5 rounded-md accent-emerald-600 cursor-pointer shrink-0" />
                    <div class="flex-1 min-w-0">
                      <div class="flex flex-wrap items-center gap-2 mb-1.5">
                        <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${badgeClass}">Bloco ${idx + 1} • ${t.subjectName}</span>
                        <span class="text-xs font-medium text-slate-500 flex items-center gap-1">
                          <i data-lucide="graduation-cap" class="w-3.5 h-3.5 text-teal-600"></i> ${escapeHtml(getTeacherById(tp.teacherId)?.name || t.channel)}
                        </span>
                        ${SUBJECT_MAP[t.subjectId] ? renderBlockTeacherMiniSelect(t.id, t.subjectId, tp.teacherId) : ''}
                      </div>
                      <h4 class="font-display font-bold text-base sm:text-lg ${tp.done ? 'line-through text-slate-400' : 'text-slate-900'}">${escapeHtml(t.topic)}</h4>
                      <p class="text-sm text-slate-600 mt-1"><strong>Objetivo:</strong> ${escapeHtml(t.objective)}</p>
                    </div>
                  </div>

                  <!-- Time Studied Input -->
                  <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 self-start">
                    <i data-lucide="clock" class="w-4 h-4 text-slate-400"></i>
                    <input type="number" min="0" max="600" placeholder="Min" value="${tp.minutes || ''}" onchange="updateTaskField('${t.id}', 'minutes', this.value)" class="w-16 bg-transparent text-sm font-semibold text-slate-800 focus:outline-none" />
                    <span class="text-xs text-slate-500">min</span>
                  </div>
                </div>

                <!-- Details Grid -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-4 pt-4 border-t border-slate-100">
                  <!-- Videoaula Block -->

    function selectScheduleDate(iso) {
      if (SCHEDULE_MAP[iso]) {
        selectedCronogramaDate = iso;
        renderCurrentPage();
      }
    }

    function jumpToMonth(monthKey) {
      const firstDay = `${monthKey}-01`;
      if (SCHEDULE_MAP[firstDay]) {
        selectedCronogramaDate = firstDay;
        renderCurrentPage();
      }
    }

    function shiftScheduleDays(delta) {
      const next = addDays(selectedCronogramaDate, delta);
      if (SCHEDULE_MAP[next]) {
        selectedCronogramaDate = next;
        renderCurrentPage();
      } else {
        showToast('Limite do período do plano (01/12/2026 a 30/11/2027) atingido.', 'info');
      }
    }

    function toggleTaskDone(taskId, dateIso, subjectId, rawTopic) {
      if (!state.taskProgress[taskId]) state.taskProgress[taskId] = {};
      const nextDone = !state.taskProgress[taskId].done;
      state.taskProgress[taskId].done = nextDone;
      state.taskProgress[taskId].completedAt = nextDone ? formatISO(new Date()) : null;

      // Sync with linked Ferretto lesson if present
      const fLink = state.taskFerrettoLinks[taskId];
      if (fLink && fLink.lessonId) {
        const linkedLes = state.ferrettoLessons.find(l => l.id === fLink.lessonId);
        if (linkedLes) {
          linkedLes.done = nextDone;
          linkedLes.completedAt = nextDone ? formatISO(new Date()) : null;
        }
      }

      if (nextDone && subjectId !== 'revisao' && subjectId !== 'simulado') {
        const added = scheduleSpacedReviews(`task_${taskId}`, subjectId, rawTopic, dateIso);
        if (added > 0) {
          showToast(`Sessão concluída! ${added} revisões espaçadas (24h, 7d, 30d) agendadas.`);
        } else {
          showToast('Sessão marcada como concluída!');
        }
      } else if (nextDone) {
        showToast('Sessão marcada como concluída!');
      }
      saveState();
      renderCurrentPage();
    }

    function updateTaskField(taskId, field, value) {
      if (!state.taskProgress[taskId]) state.taskProgress[taskId] = {};
      state.taskProgress[taskId][field] = value;
      saveState();
      if (field === 'videoDone') {
        showToast(value ? 'Videoaula marcada como assistida!' : 'Videoaula desmarcada.', 'info');
      }
      if (field === 'minutes') {
        updateSidebarProgress();
      }
    }

    /* =========================================================================
       10. PÁGINA 3 — CALENDÁRIO (MENSAL E SEMANAL)
       ========================================================================= */
    function renderCalendario(container) {
      const months = getMonthList();
      const curM = months.find(m => m.key === calendarMonthKey) || months[0];

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
          <div>
            <h2 class="font-display text-2xl font-extrabold text-slate-900">Calendário de Estudos</h2>
            <p class="text-sm text-slate-500">Visão mensal e semanal de Dezembro/2026 a Novembro/2027. Clique em qualquer dia para abrir as tarefas.</p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <div class="bg-white border border-slate-200 rounded-xl p-1 flex">
              <button onclick="setCalendarMode('mensal')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${calendarViewMode === 'mensal' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-100'}">Mensal</button>
              <button onclick="setCalendarMode('semanal')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${calendarViewMode === 'semanal' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-100'}">Semanal</button>
            </div>
            ${calendarViewMode === 'mensal' ? `
              <select onchange="setCalendarMonth(this.value)" class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold text-slate-700">
                ${months.map(m => `<option value="${m.key}" ${m.key === curM.key ? 'selected' : ''}>${m.label}</option>`).join('')}
              </select>
            ` : `
              <div class="flex items-center gap-1">
                <button onclick="shiftCalendarWeek(-7)" class="p-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                <button onclick="shiftCalendarWeek(7)" class="p-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
              </div>
            `}
          </div>
        </div>

        <!-- Legend -->
        <div class="flex flex-wrap items-center gap-3 mb-4 text-xs font-semibold text-slate-600">
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Dia concluído</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-violet-500"></span> Simulado</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Redação</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-teal-500"></span> Revisões agendadas</span>
        </div>

        ${calendarViewMode === 'mensal' ? renderMonthlyCalendarGrid(curM) : renderWeeklyCalendarGrid()}
      `;
    }

    function renderMonthlyCalendarGrid(mObj) {
      const firstOfMonth = new Date(mObj.year, mObj.month, 1);
      const daysInMonth = new Date(mObj.year, mObj.month + 1, 0).getDate();
      const startDow = firstOfMonth.getDay();
      const phaseOfMonth = getPhaseByDate(`${mObj.key}-01`);

      let cells = '';
      for (let i = 0; i < startDow; i++) {
        cells += `<div class="bg-slate-50/50 rounded-xl min-h-[86px] border border-slate-100"></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const iso = `${mObj.key}-${String(d).padStart(2, '0')}`;
        const dayData = SCHEDULE_MAP[iso];
        const fActs = state.ferrettoScheduleActivities.filter(a => a.date === iso);
        const doneCount = (dayData ? dayData.tasks.filter(t => state.taskProgress[t.id]?.done).length : 0) + fActs.filter(a => a.done).length;
        const totalCount = (dayData ? dayData.tasks.length : 0) + fActs.length;
        const pct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
        const hasRev = state.reviews.some(r => !r.done && r.dueDate === iso);

        cells += `
          <button onclick="goToDayInSchedule('${iso}')" class="text-left bg-white hover:border-emerald-400 border ${pct === 100 && totalCount > 0 ? 'border-emerald-300 bg-emerald-50/30' : 'border-slate-200'} rounded-xl p-2 sm:p-2.5 min-h-[88px] flex flex-col justify-between transition group">
            <div class="flex items-center justify-between w-full">
              <span class="font-display font-bold text-sm text-slate-800 group-hover:text-emerald-700">${d}</span>
              <div class="flex items-center gap-1">
                ${dayData?.isSimuladoDay ? `<span class="w-2 h-2 rounded-full bg-violet-500" title="Simulado"></span>` : ''}
                ${dayData?.hasRedacao ? `<span class="w-2 h-2 rounded-full bg-rose-500" title="Redação"></span>` : ''}
                ${hasRev ? `<span class="w-2 h-2 rounded-full bg-teal-500" title="Revisões pendentes"></span>` : ''}
              </div>
            </div>
            <div class="mt-1 space-y-0.5 hidden sm:block">
              ${dayData ? dayData.tasks.slice(0, 2).map(t => `<p class="text-[10px] text-slate-500 truncate">${t.subjectName}</p>`).join('') : ''}
            </div>
            <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden mt-2">
              <div class="h-full bg-emerald-500 rounded-full" style="width:${pct}%"></div>
            </div>
          </button>
        `;
      }

      return `
        <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-xs">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-display font-bold text-lg text-slate-900">${mObj.label}</h3>
            <span class="text-xs font-bold px-2.5 py-1 rounded-full border ${phaseOfMonth.badge}">${phaseOfMonth.name}</span>
          </div>
          <div class="grid grid-cols-7 gap-1.5 sm:gap-2 mb-2 text-center">
            ${WEEKDAY_SHORT.map(w => `<div class="text-xs font-bold text-slate-400 py-1">${w}</div>`).join('')}
          </div>
          <div class="grid grid-cols-7 gap-1.5 sm:gap-2">
            ${cells}
          </div>
        </div>
      `;
    }

    function renderWeeklyCalendarGrid() {
      const base = parseISO(calendarWeekDate);
      const dow = base.getDay();
      const diff = dow === 0 ? -6 : 1 - dow;
      const mon = new Date(base);
      mon.setDate(base.getDate() + diff);

      const cols = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(mon);
        d.setDate(mon.getDate() + i);
        const iso = formatISO(d);
        cols.push({ iso, data: SCHEDULE_MAP[iso], dow: d.getDay() });
      }

      return `
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-7 gap-3">
          ${cols.map(c => {
            if (!c.data) {
              return `<div class="bg-slate-100/70 rounded-2xl p-4 border border-slate-200 text-xs text-slate-400">Fora do período (${formatBR(c.iso)})</div>`;
            }
            return `
              <div class="bg-white rounded-2xl border border-slate-200 p-3.5 flex flex-col justify-between shadow-xs">
                <div>
                  <div class="flex items-center justify-between border-b border-slate-100 pb-2 mb-2.5">
                    <div>
                      <p class="text-xs font-bold text-emerald-700">${WEEKDAY_SHORT[c.dow]}</p>
                      <p class="font-display font-bold text-sm text-slate-900">${formatBR(c.iso).slice(0, 5)}</p>
                    </div>
                    <button onclick="goToDayInSchedule('${c.iso}')" class="text-[11px] font-semibold text-emerald-700 hover:underline">Abrir</button>
                  </div>
                  <div class="space-y-2">
                    ${c.data.tasks.map(t => {
                      const done = state.taskProgress[t.id]?.done;
                      return `
                        <div class="p-2 rounded-xl border ${done ? 'bg-emerald-50 border-emerald-200' : 'bg-slate-50 border-slate-100'}">
                          <p class="text-[11px] font-bold ${done ? 'text-emerald-800 line-through' : 'text-slate-800'}">${t.subjectName}</p>
                          <p class="text-[10px] text-slate-500 line-clamp-2 mt-0.5">${escapeHtml(t.rawTopic)}</p>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function setCalendarMode(mode) { calendarViewMode = mode; renderCurrentPage(); }
    function setCalendarMonth(mKey) { calendarMonthKey = mKey; renderCurrentPage(); }
    function shiftCalendarWeek(delta) {
      const next = addDays(calendarWeekDate, delta);
      if (next >= PLAN_START && next <= PLAN_END) {
        calendarWeekDate = next;
        renderCurrentPage();
      }
    }

    function saveSyllabusTeacher(key, teacherId) {
      if (!state.syllabusProgress[key]) state.syllabusProgress[key] = {};
      state.syllabusProgress[key].teacherId = teacherId;
      saveState();
      const prof = getTeacherById(teacherId);
      showToast(prof ? `Professor/plataforma definido: ${prof.name}` : 'Seleção limpa.', 'info');
      renderCurrentPage();
    }

    function scheduleSyllabusTopicToToday(subjId, topic, teacherId) {
      state.ferrettoScheduleActivities.push({
        id: `fact_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        date: selectedCronogramaDate,
        subjectId: subjId,
        teacherId: teacherId || '',
        moduleId: '',
        lessonId: '',
        customLessonTitle: topic,
        duration: 45,
        done: false,
        completedAt: null,
        notes: ''
      });
      saveState();
      showToast(`"${topic}" adicionado ao cronograma de ${formatBR(selectedCronogramaDate)}!`);
    }

    function selectDisciplina(id) { activeDisciplinaId = id; renderCurrentPage(); }

    function toggleSyllabusTopic(key, subjId, topic) {
      if (!state.syllabusProgress[key]) state.syllabusProgress[key] = {};
      const next = !state.syllabusProgress[key].done;
      state.syllabusProgress[key].done = next;
      if (next) {
        scheduleSpacedReviews(`syl_${key}`, subjId, topic, getDefaultActiveDate());
        showToast(`"${topic}" concluído! Revisões 24h, 7d e 30d agendadas.`);
      }
      saveState();
      renderCurrentPage();
    }

    function saveSyllabusLink(key, url) {
      if (!state.syllabusProgress[key]) state.syllabusProgress[key] = {};
      state.syllabusProgress[key].link = url;
      saveState();
      showToast('Link da videoaula salvo.');
    }

    function manualScheduleReview(subjId, topic) {
      const added = scheduleSpacedReviews(`man_${subjId}_${Date.now()}`, subjId, topic, getDefaultActiveDate());
      saveState();
      showToast(`${added} revisões espaçadas (24h, 7d, 30d) adicionadas para "${topic}".`);

    function submitQuestionLog(e) {
      e.preventDefault();
      const facil = Number(document.getElementById('qFacil').value) || 0;
      const media = Number(document.getElementById('qMedia').value) || 0;
      const dificil = Number(document.getElementById('qDificil').value) || 0;
      const enem = Number(document.getElementById('qEnem').value) || 0;
      const total = facil + media + dificil + enem;
      const correct = Number(document.getElementById('qCorrect').value) || 0;

      if (total <= 0) {
        showToast('Informe pelo menos 1 questão nos campos de dificuldade.', 'error');
        return;
      }
      if (correct > total) {
        showToast('O número de acertos não pode ser maior que o total de questões.', 'error');
        return;
      }

      state.questionLogs.push({
        id: `ql_${Date.now()}`,
        date: formatISO(new Date()),
        subjectId: document.getElementById('qSubject').value,
        topic: document.getElementById('qTopic').value.trim(),
        facil, media, dificil, enem, total, correct,
        minutes: Number(document.getElementById('qMinutes').value) || 0
      });
      saveState();
      showToast(`Bateria de ${total} questões salva (${correct} acertos)!`);
      renderCurrentPage();
    }

    function deleteQuestionLog(id) {
      state.questionLogs = state.questionLogs.filter(x => x.id !== id);
      saveState();
      renderCurrentPage();
    }

    function submitErrorEntry(e) {
      e.preventDefault();
      const subjId = document.getElementById('errSubject').value;
      const topic = document.getElementById('errTopic').value.trim();
      const revDate = document.getElementById('errRevDate').value;

      state.errorNotebook.unshift({
        id: `err_${Date.now()}`,
        questionRef: document.getElementById('errRef').value.trim(),
        subjectId: subjId,
        topic,
        reason: document.getElementById('errReason').value.trim(),
        solution: document.getElementById('errSolution').value.trim(),
        reviewDate: revDate,
        reviewed: false
      });

      // Also add to spaced reviews queue
      state.reviews.push({
        id: `rev_err_${Date.now()}`,
        sourceKey: `err_${Date.now()}`,
        subjectId: subjId,
        topic: `Caderno de Erros: ${topic}`,
        type: 'Erro',
        dueDate: revDate,
        done: false,
        createdAt: formatISO(new Date())
      });

      saveState();
      showToast('Erro salvo no Caderno de Erros e agendado para revisão!');
      renderCurrentPage();
    }

    function toggleErrorReviewed(id) {
      const item = state.errorNotebook.find(e => e.id === id);
      if (item) {
        item.reviewed = !item.reviewed;
        saveState();
        renderCurrentPage();
      }
    }

    function deleteErrorEntry(id) {
      state.errorNotebook = state.errorNotebook.filter(e => e.id !== id);
      saveState();
      renderCurrentPage();
    }

                <label class="block text-xs font-semibold text-slate-600 mb-1">Assunto</label>

    function renderFlashcardsTab() {
      const cards = state.flashcards;
      const card = cards[activeFlashcardIdx];

      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-6 shadow-xs flex flex-col items-center justify-center min-h-[340px]">

                <h3 class="font-display font-bold text-slate-900">Nenhum Flashcard Criado</h3>
                <p class="text-xs text-slate-500 mt-1">Crie flashcards ao lado com perguntas na frente e respostas curtas no verso para treinar recuperação ativa.</p>

              <div class="w-full max-w-lg">
                <div class="flex items-center justify-between text-xs font-bold text-slate-500 mb-3">
                  <span>Carta ${activeFlashcardIdx + 1} de ${cards.length} • ${SUBJECT_MAP[card.subjectId]?.name || ''}</span>
                  <span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 uppercase">${card.mastery}</span>
                </div>
                <div onclick="flipFlashcard()" class="cursor-pointer bg-gradient-to-br ${flashcardFlipped ? 'from-emerald-600 to-teal-700 text-white' : 'from-slate-50 to-white text-slate-900'} border-2 ${flashcardFlipped ? 'border-emerald-500' : 'border-slate-200'} rounded-3xl p-8 min-h-[200px] flex flex-col items-center justify-center text-center shadow-sm transition-all">
                  <span class="text-[11px] font-bold uppercase tracking-wider mb-2 ${flashcardFlipped ? 'text-emerald-100' : 'text-slate-400'}">${flashcardFlipped ? 'Verso (Resposta)' : 'Frente (Pergunta) — Clique para virar'}</span>
                  <p class="font-display font-bold text-lg leading-relaxed">${escapeHtml(flashcardFlipped ? card.back : card.front)}</p>
                </div>
                <div class="flex flex-wrap items-center justify-between gap-2 mt-4">
                  <div class="flex gap-2">
                    <button onclick="rateFlashcard('${card.id}', 'revisar')" class="px-3 py-2 rounded-xl bg-amber-100 text-amber-800 text-xs font-bold hover:bg-amber-200">Preciso Revisar</button>
                    <button onclick="rateFlashcard('${card.id}', 'dominado')" class="px-3 py-2 rounded-xl bg-emerald-100 text-emerald-800 text-xs font-bold hover:bg-emerald-200">Lembrei Fácil ✓</button>
                  </div>
                  <div class="flex items-center gap-2">
                    <button onclick="navFlashcard(-1)" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                    <button onclick="navFlashcard(1)" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                    <button onclick="deleteFlashcard('${card.id}')" class="p-2 rounded-xl text-rose-600 hover:bg-rose-50"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                  </div>
                </div>
              </div>
            `}
          </div>

          <form onsubmit="submitFlashcard(event)" class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-3.5 h-fit">
            <h3 class="font-display font-bold text-slate-900 text-base">Criar Novo Flashcard</h3>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Disciplina</label>
              <select id="fcSubj" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
                ${SUBJECTS.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Frente (Pergunta / Conceito)</label>
              <textarea id="fcFront" rows="2" required placeholder="Ex: Qual a diferença entre mitose e meiose?" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm"></textarea>

            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Verso (Resposta objetiva)</label>
              <textarea id="fcBack" rows="3" required placeholder="Mitose gera 2 células idênticas (2n); Meiose gera 4 células haploides (n)..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm"></textarea>

            <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold transition">Adicionar Flashcard</button>

    function renderActiveRecallTab() {
      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-5 shadow-xs">
            <h3 class="font-display font-bold text-slate-900 text-base mb-3">Registros de Recuperação Ativa & Mapas Mentais (${state.activeRecalls.length})</h3>
            ${state.activeRecalls.length === 0 ? `
              <p class="text-sm text-slate-500 bg-slate-50 rounded-xl p-4">Feche o caderno, tente escrever tudo o que lembra sobre um conteúdo e registre aqui suas sessões de recuperação ativa ou mapas mentais.</p>
            ` : `
              <div class="space-y-3">
                ${state.activeRecalls.slice().reverse().map(ar => `
                  <div class="p-4 rounded-xl bg-slate-50 border border-slate-200">
                    <div class="flex items-center justify-between mb-1.5">
                      <div class="flex items-center gap-2">
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-800">${ar.type}</span>
                        <span class="text-xs font-bold text-slate-700">${SUBJECT_MAP[ar.subjectId]?.name || ''}</span>
                        <span class="text-xs text-slate-400">${formatBR(ar.date)}</span>
                      </div>
                      <button onclick="deleteActiveRecall('${ar.id}')" class="text-xs text-rose-600 font-semibold">Remover</button>
                    </div>

                    <p class="text-xs text-slate-600 mt-1 whitespace-pre-line">${escapeHtml(ar.notes)}</p>

          <form onsubmit="submitActiveRecall(event)" class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-3.5 h-fit">
            <h3 class="font-display font-bold text-slate-900 text-base">Nova Sessão de Revisão Ativa</h3>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Formato</label>
              <select id="arType" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
                <option value="Recuperação Ativa">Recuperação Ativa (sem consulta)</option>
                <option value="Mapa Mental">Mapa Mental / Resumo Visual</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Disciplina</label>
              <select id="arSubj" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
                ${SUBJECTS.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Assunto</label>
              <input id="arTopic" type="text" required placeholder="Ex: Era Vargas" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">O que lembrei / Pontos que esqueci</label>
              <textarea id="arNotes" rows="4" required placeholder="Escreva o que conseguiu recuperar sem consultar e o que precisou rever..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm"></textarea>
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold transition">Salvar Registro</button>
          </form>
        </div>
      `;
    }

    function setRevisaoTab(tab) { activeRevisaoTab = tab; renderCurrentPage(); }
    function completeReview(id) {
      const r = state.reviews.find(x => x.id === id);
      if (r) { r.done = true; saveState(); showToast('Revisão concluída!'); renderCurrentPage(); }
    }
    function deleteReview(id) { state.reviews = state.reviews.filter(x => x.id !== id); saveState(); renderCurrentPage(); }
    function submitManualReview(e) {
      e.preventDefault();
      const added = scheduleSpacedReviews(`man_${Date.now()}`, document.getElementById('revSubj').value, document.getElementById('revTopic').value.trim(), document.getElementById('revDate').value);
      saveState();
      showToast(`${added} revisões agendadas!`);
      renderCurrentPage();
    }
    function submitFlashcard(e) {
      e.preventDefault();
      state.flashcards.push({
        id: `fc_${Date.now()}`,
        subjectId: document.getElementById('fcSubj').value,
        front: document.getElementById('fcFront').value.trim(),
        back: document.getElementById('fcBack').value.trim(),
        mastery: 'novo'
      });
      activeFlashcardIdx = state.flashcards.length - 1;
      flashcardFlipped = false;
      saveState();
      showToast('Flashcard adicionado!');
      renderCurrentPage();
    }
    function flipFlashcard() { flashcardFlipped = !flashcardFlipped; renderCurrentPage(); }
    function navFlashcard(d) {
      if (!state.flashcards.length) return;
      activeFlashcardIdx = (activeFlashcardIdx + d + state.flashcards.length) % state.flashcards.length;
      flashcardFlipped = false;
      renderCurrentPage();
    }
    function rateFlashcard(id, status) {
      const c = state.flashcards.find(x => x.id === id);
      if (c) { c.mastery = status; saveState(); navFlashcard(1); }
    }
    function deleteFlashcard(id) {
      state.flashcards = state.flashcards.filter(x => x.id !== id);
      activeFlashcardIdx = 0;
      flashcardFlipped = false;
      saveState();
      renderCurrentPage();
    }
    function submitActiveRecall(e) {
      e.preventDefault();
      state.activeRecalls.push({
        id: `ar_${Date.now()}`,
        date: formatISO(new Date()),
        type: document.getElementById('arType').value,
        subjectId: document.getElementById('arSubj').value,
        topic: document.getElementById('arTopic').value.trim(),
        notes: document.getElementById('arNotes').value.trim()
      });
      saveState();
      showToast('Sessão de revisão ativa registrada!');
      renderCurrentPage();
    }
    function deleteActiveRecall(id) { state.activeRecalls = state.activeRecalls.filter(x => x.id !== id); saveState(); renderCurrentPage(); }

    /* =========================================================================
       14. PÁGINA 7 — REDAÇÃO (LUMA E PONTO + FERNANDA PESSOA)
       ========================================================================= */
    function renderRedacao(container) {
      const totalLessons = ALL_REDACAO_LESSONS.length;
      const doneLessons = ALL_REDACAO_LESSONS.filter(l => state.redacaoLessons[l.id]?.done).length;
      const lessonPct = Math.round((doneLessons / totalLessons) * 100);

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
          <div>
            <h2 class="font-display text-2xl font-extrabold text-slate-900">Área Exclusiva de Redação</h2>
            <p class="text-sm text-slate-500">Baseada em <strong>Luma e Ponto + Curso Fernanda Pessoa</strong> • Progresso nas aulas: ${doneLessons}/${totalLessons} (${lessonPct}%).</p>
          </div>
          <div class="bg-white border border-slate-200 rounded-xl p-1 flex self-start">
            <button onclick="setRedacaoTab('modulos')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${activeRedacaoTab === 'modulos' ? 'bg-rose-600 text-white' : 'text-slate-600'}">Módulos & Aulas (${doneLessons}/${totalLessons})</button>
            <button onclick="setRedacaoTab('avaliacao')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${activeRedacaoTab === 'avaliacao' ? 'bg-rose-600 text-white' : 'text-slate-600'}">Ficha ENEM & Histórico (${state.redacaoHistory.length})</button>
          </div>
        </div>

        ${activeRedacaoTab === 'modulos' ? `
          <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-6 text-xs text-amber-900 flex items-start gap-2.5">
            <i data-lucide="info" class="w-4 h-4 text-amber-600 shrink-0 mt-0.5"></i>
            <span><strong>Nota de fidelidade ao plano:</strong> Os módulos abaixo seguem exatamente a sua lista oficial (Módulos 01, 02, 03 e 05). O Módulo 04 não foi incluído nem inventado pois não constava na lista disponibilizada.</span>
          </div>

          <div class="space-y-6">
            ${REDACAO_MODULES.map(mod => {
              const modDone = mod.lessons.filter(l => state.redacaoLessons[l.id]?.done).length;
              return `
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs">
                  <div class="flex flex-wrap items-center justify-between gap-2 pb-4 border-b border-slate-100 mb-4">
                    <div>
                      <h3 class="font-display font-extrabold text-base text-slate-900">${mod.title}</h3>
                      <p class="text-xs text-slate-500">${mod.subtitle}</p>
                    </div>
                    <span class="text-xs font-bold px-3 py-1 rounded-full bg-rose-50 text-rose-700 border border-rose-200">${modDone}/${mod.lessons.length} concluídas</span>
                  </div>

                  <div class="space-y-2.5">
                    ${mod.lessons.map(l => {
                      const lp = state.redacaoLessons[l.id] || {};
                      return `
                        <details class="group rounded-2xl border ${lp.done ? 'bg-emerald-50/40 border-emerald-200' : 'bg-slate-50/70 border-slate-200'} overflow-hidden">
                          <summary class="p-3.5 flex items-center justify-between gap-3 cursor-pointer list-none">
                            <div class="flex items-center gap-3 min-w-0">
                              <input type="checkbox" ${lp.done ? 'checked' : ''} onclick="event.stopPropagation()" onchange="toggleRedacaoLesson('${l.id}', '${escapeHtml(l.title)}')" class="w-5 h-5 rounded accent-emerald-600 cursor-pointer shrink-0" />
                              <div class="min-w-0">
                                <span class="text-xs font-extrabold text-rose-700 mr-1.5">${l.code}</span>
                                <span class="text-sm font-bold ${lp.done ? 'line-through text-slate-500' : 'text-slate-900'}">${escapeHtml(l.title)}</span>
                              </div>
                            </div>
                            <span class="text-xs font-semibold text-slate-400 group-open:rotate-180 transition-transform shrink-0">
                              <i data-lucide="chevron-down" class="w-4 h-4"></i>
                            </span>
                          </summary>
                          <div class="p-4 pt-2 border-t border-slate-200/70 bg-white space-y-3">
                            <div class="bg-rose-50/60 border border-rose-100 rounded-xl p-3 text-xs text-rose-900">
                              <strong>Exercício Prático:</strong> ${escapeHtml(l.exercise)}
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">

                                <input type="url" placeholder="Cole o link da aula..." value="${escapeHtml(lp.link || '')}" onchange="updateRedacaoLesson('${l.id}', 'link', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs" />

                              <div>

                                <input type="date" value="${lp.date || ''}" onchange="updateRedacaoLesson('${l.id}', 'date', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs" />
                              </div>
                              <div class="flex items-end gap-2">
                                <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 w-full cursor-pointer">
                                  <input type="checkbox" ${lp.reviewed ? 'checked' : ''} onchange="updateRedacaoLesson('${l.id}', 'reviewed', this.checked)" class="accent-teal-600 rounded" />

                              <div>
                                <label class="block text-[11px] font-bold text-slate-600 mb-1">Anotações da Aula</label>

                              </div>
                              <div>
                                <label class="block text-[11px] font-bold text-slate-600 mb-1">Principais Aprendizados</label>
                                <textarea rows="2" placeholder="O que aplicar na próxima redação..." onchange="updateRedacaoLesson('${l.id}', 'learnings', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">${escapeHtml(lp.learnings || '')}</textarea>
                              </div>
                            </div>
                          </div>
                        </details>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>

      `;

      if (activeRedacaoTab === 'avaliacao') {
        initRedacaoChart();
      }
    }

            <div class="flex-1 min-h-[260px] relative">
              <canvas id="redacaoEvolutionChart"></canvas>
            </div>

          ` : `
            <div class="overflow-x-auto">

      if (!state.redacaoLessons[lessonId]) state.redacaoLessons[lessonId] = {};
      const next = !state.redacaoLessons[lessonId].done;
      state.redacaoLessons[lessonId].done = next;
      if (next && !state.redacaoLessons[lessonId].date) {
        state.redacaoLessons[lessonId].date = formatISO(new Date());

      if (next) {
        scheduleSpacedReviews(`red_${lessonId}`, 'redacao', `${lessonId} — ${title}`, getDefaultActiveDate());

    function saveUepbTracker(e) {

        notaCorteRef: document.getElementById('uepbCorte').value.trim(),
        editalStatus: document.getElementById('uepbEdital').value.trim(),
        observacoes: document.getElementById('uepbObs').value.trim()
      };
      saveState();
      showToast('Informações oficiais da UEPB salvas!');
    }

    function addGoal(e) {
      e.preventDefault();
      state.goals.unshift({
        id: `goal_${Date.now()}`,
        period: document.getElementById('goalPeriod').value,
        text: document.getElementById('goalText').value.trim(),
        done: false,
        createdAt: formatISO(new Date())
      });
      saveState();
      showToast('Meta adicionada!');
      renderCurrentPage();
    }

    function toggleGoal(id) {
      const g = state.goals.find(x => x.id === id);
      if (g) { g.done = !g.done; saveState(); renderCurrentPage(); }
    }

    function deleteGoal(id) {
      state.goals = state.goals.filter(x => x.id !== id);
      saveState();
      renderCurrentPage();

    function addPersonalLink(e) {
      e.preventDefault();
      state.personalLinks.unshift({
        id: `pl_${Date.now()}`,
        title: document.getElementById('plTitle').value.trim(),
        category: document.getElementById('plCat').value,
        url: document.getElementById('plUrl').value.trim()
      });

    function deletePersonalLink(id) {
      state.personalLinks = state.personalLinks.filter(x => x.id !== id);
      saveState();
      renderCurrentPage();
    }

    function exportBackupJson() {
      const dataStr = JSON.stringify(state, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `backup_psicologia_uepb_enem2027_${formatISO(new Date())}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Backup .json exportado com sucesso!');
    }

    function triggerImportBackup() {
      document.getElementById('importJsonInput').click();
    }

    document.getElementById('importJsonInput').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          state = { ...getDefaultState(), ...parsed };
          saveState();
          showToast('Backup restaurado com sucesso!');
          renderCurrentPage();
        } catch (err) {
          showToast('Arquivo inválido. Selecione um backup .json gerado pela plataforma.', 'error');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    function confirmResetAllData() {
      openConfirmModal(
        'Resetar todos os dados?',
        'Isso apagará todo o seu progresso salvo neste navegador (cronograma, questões, redações, simulados e revisões). Recomendamos exportar um backup antes. Deseja continuar?',
        () => {
          state = getDefaultState();
          saveState();
          showToast('Todos os dados foram zerados.', 'info');
          renderCurrentPage();
        },
        'Sim, zerar tudo',
        true
      );
    }

    function getTeacherById(id) {
      if (!id) return null;
      return state.ferrettoTeachers.find(t => t.id === id) || null;
    }

    function getModuleById(id) {
      if (!id) return null;
      return state.ferrettoModules.find(m => m.id === id) || null;
    }

    function getLessonById(id) {
      if (!id) return null;
      return state.ferrettoLessons.find(l => l.id === id) || null;
    }

    function getTeacherInitials(name) {
      if (!name) return '?';
      const parts = name.trim().split(/\s+/);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function renderTeacherAvatar(teacher, sizeClass = 'w-12 h-12 text-sm') {
      if (teacher && teacher.avatar) {
        return `<img src="${escapeHtml(teacher.avatar)}" alt="${escapeHtml(teacher.name)}" class="${sizeClass} rounded-2xl object-cover border border-slate-200 shrink-0 bg-slate-100" onerror="this.style.display='none'" />`;
      }
      return `<div class="${sizeClass} rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 text-white font-display font-extrabold flex items-center justify-center shrink-0 shadow-xs">${escapeHtml(getTeacherInitials(teacher ? teacher.name : '?'))}</div>`;
    }

    function getSubjectExtras(subjId) {
      if (!state.ferrettoSubjectExtras[subjId]) {
        state.ferrettoSubjectExtras[subjId] = { notes: '', materials: [], exercises: [] };
      }
      const ex = state.ferrettoSubjectExtras[subjId];
      if (!Array.isArray(ex.materials)) ex.materials = [];
      if (!Array.isArray(ex.exercises)) ex.exercises = [];
      return ex;
    }

    function handleTeacherAvatarUpload(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 160;
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
          const input = document.getElementById('tfAvatar');
          if (input) input.value = dataUrl;
          showToast('Foto carregada e otimizada!');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function submitTeacherForm(e) {
      e.preventDefault();
      const name = document.getElementById('tfName').value.trim();
      const checkedSubjs = Array.from(document.querySelectorAll('input[name="tfSubjects"]:checked')).map(cb => cb.value);
      if (!name) { showToast('Informe o nome do professor.', 'error'); return; }
      if (checkedSubjs.length === 0) { showToast('Selecione pelo menos uma disciplina.', 'error'); return; }

      const payload = {
        name,
        avatar: document.getElementById('tfAvatar').value.trim(),
        subjectIds: checkedSubjs,
        bio: document.getElementById('tfBio').value.trim(),
        moduleSummary: document.getElementById('tfModuleSummary').value.trim(),
        profileUrl: document.getElementById('tfProfileUrl').value.trim(),
        extraLinks: document.getElementById('tfExtraLinks').value.trim(),
        notes: document.getElementById('tfNotes').value.trim()
      };

      if (editingTeacherId) {
        const idx = state.ferrettoTeachers.findIndex(t => t.id === editingTeacherId);
        if (idx !== -1) {
          state.ferrettoTeachers[idx] = { ...state.ferrettoTeachers[idx], ...payload };
        }
        showToast(`Professor "${name}" atualizado em toda a plataforma!`);
      } else {
        state.ferrettoTeachers.push({
          id: `prof_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          ...payload,
          createdAt: formatISO(new Date())
        });
        showToast(`Professor "${name}" cadastrado na Biblioteca!`);
      }

      showTeacherForm = false;
      editingTeacherId = null;
      saveState();
      renderCurrentPage();
    }

    function confirmDeleteTeacher(id) {
      const t = getTeacherById(id);
      if (!t) return;
      openConfirmModal(
        `Excluir ${t.name}?`,
        'O professor será removido da Biblioteca, mas seus módulos, aulas e registros do cronograma serão preservados (ficando apenas sem professor vinculado).',
        () => {
          state.ferrettoTeachers = state.ferrettoTeachers.filter(x => x.id !== id);
          if (DEFAULT_SEED_TEACHERS.some(s => s.id === id) && !state.dismissedSeedTeacherIds.includes(id)) {
            state.dismissedSeedTeacherIds.push(id);
          }
          state.ferrettoModules.forEach(m => { if (m.teacherId === id) m.teacherId = ''; });
          state.ferrettoLessons.forEach(l => { if (l.teacherId === id) l.teacherId = ''; });
          state.ferrettoScheduleActivities.forEach(a => { if (a.teacherId === id) a.teacherId = ''; });
          if (viewingTeacherId === id) viewingTeacherId = null;
          saveState();
          showToast('Professor removido da biblioteca.', 'info');
          renderCurrentPage();
        },
        'Sim, excluir',
        true
      );
    }

    function openNewModuleForm() { editingModuleId = null; showModuleForm = true; renderCurrentPage(); }
    function editFerrettoModule(id) { editingModuleId = id; showModuleForm = true; renderCurrentPage(); }
    function closeModuleForm() { editingModuleId = null; showModuleForm = false; renderCurrentPage(); }

    function submitModuleForm(e, subjId) {
      e.preventDefault();
      const title = document.getElementById('mfTitle').value.trim();
      if (!title) return;
      const teacherId = document.getElementById('mfTeacher').value;
      const description = document.getElementById('mfDesc').value.trim();

      if (editingModuleId) {
        const m = getModuleById(editingModuleId);
        if (m) {
          m.title = title;
          m.teacherId = teacherId;
          m.description = description;
        }
        showToast('Módulo atualizado!');
      } else {
        const count = state.ferrettoModules.filter(m => m.subjectId === subjId).length;
        state.ferrettoModules.push({
          id: `mod_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          subjectId: subjId,
          teacherId,
          title,
          description,
          order: count
        });
        showToast('Módulo criado!');
      }
      showModuleForm = false;
      editingModuleId = null;
      saveState();
      renderCurrentPage();
    }

    function moveFerrettoModule(modId, dir) {
      const mod = getModuleById(modId);
      if (!mod) return;
      const list = state.ferrettoModules.filter(m => m.subjectId === mod.subjectId).sort((a, b) => (a.order || 0) - (b.order || 0));
      const idx = list.findIndex(m => m.id === modId);
      const swapIdx = idx + dir;
      if (swapIdx < 0 || swapIdx >= list.length) return;
      list.forEach((m, i) => { m.order = i; });
      const tmp = list[idx].order;
      list[idx].order = list[swapIdx].order;
      list[swapIdx].order = tmp;
      saveState();
      renderCurrentPage();
    }

    function confirmDeleteFerrettoModule(modId) {
      const mod = getModuleById(modId);
      if (!mod) return;
      openConfirmModal(
        `Excluir módulo "${mod.title}"?`,
        'Todas as aulas vinculadas a este módulo também serão removidas.',
        () => {
          const lessonIds = state.ferrettoLessons.filter(l => l.moduleId === modId).map(l => l.id);
          state.ferrettoModules = state.ferrettoModules.filter(m => m.id !== modId);
          state.ferrettoLessons = state.ferrettoLessons.filter(l => l.moduleId !== modId);
          state.ferrettoScheduleActivities.forEach(a => {
            if (a.moduleId === modId) a.moduleId = '';
            if (lessonIds.includes(a.lessonId)) a.lessonId = '';
          });
          saveState();
          showToast('Módulo excluído.', 'info');
          renderCurrentPage();
        },
        'Excluir módulo',
        true
      );
    }

    function openNewLessonForm(modId) { showLessonFormForModuleId = modId; editingLessonId = null; renderCurrentPage(); }
    function editFerrettoLesson(lessonId) {
      const les = getLessonById(lessonId);
      if (!les) return;
      showLessonFormForModuleId = les.moduleId;
      editingLessonId = lessonId;
      renderCurrentPage();
    }
    function closeLessonForm() { showLessonFormForModuleId = null; editingLessonId = null; renderCurrentPage(); }

    function submitLessonForm(e, subjId, modId) {
      e.preventDefault();
      const title = document.getElementById('lfTitle').value.trim();
      if (!title) return;
      const mod = getModuleById(modId);
      const payload = {
        title,
        content: document.getElementById('lfContent').value.trim(),
        duration: Number(document.getElementById('lfDuration').value) || 0,
        teacherId: document.getElementById('lfTeacher').value || (mod ? mod.teacherId : ''),
        link: document.getElementById('lfLink').value.trim(),
        exercises: document.getElementById('lfExercises').value.trim()
      };

      if (editingLessonId) {
        const les = getLessonById(editingLessonId);
        if (les) Object.assign(les, payload);
        showToast('Aula atualizada!');
      } else {
        const count = state.ferrettoLessons.filter(l => l.moduleId === modId).length;
        state.ferrettoLessons.push({
          id: `aula_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          subjectId: subjId,
          moduleId: modId,
          ...payload,
          notes: '',
          materials: '',
          exercisesDone: false,
          needsReview: false,
          done: false,
          completedAt: null,
          order: count
        });
        showToast('Aula adicionada ao módulo!');
      }
      showLessonFormForModuleId = null;
      editingLessonId = null;
      saveState();
      renderCurrentPage();
    }

    function moveFerrettoLesson(lessonId, dir) {
      const les = getLessonById(lessonId);
      if (!les) return;
      const list = state.ferrettoLessons.filter(l => l.moduleId === les.moduleId).sort((a, b) => (a.order || 0) - (b.order || 0));
      const idx = list.findIndex(l => l.id === lessonId);
      const swapIdx = idx + dir;
      if (swapIdx < 0 || swapIdx >= list.length) return;
      list.forEach((l, i) => { l.order = i; });
      const tmp = list[idx].order;
      list[idx].order = list[swapIdx].order;
      list[swapIdx].order = tmp;
      saveState();
      renderCurrentPage();
    }

    function toggleFerrettoLessonDone(lessonId) {
      const les = getLessonById(lessonId);
      if (!les) return;
      const next = !les.done;
      les.done = next;
      les.completedAt = next ? formatISO(new Date()) : null;

      // Auto-sync with any scheduled Ferretto activities referencing this lesson
      state.ferrettoScheduleActivities.forEach(a => {
        if (a.lessonId === lessonId) {
          a.done = next;
          a.completedAt = les.completedAt;
        }
      });

      if (next) {
        scheduleSpacedReviews(`ferretto_${lessonId}`, les.subjectId, les.title, getDefaultActiveDate());
        showToast(`Aula "${les.title}" concluída! Progresso e revisões atualizados.`);
      }
      saveState();
      renderCurrentPage();
    }

    function toggleFerrettoLessonReview(lessonId) {
      const les = getLessonById(lessonId);
      if (!les) return;
      les.needsReview = !les.needsReview;
      saveState();
      showToast(les.needsReview ? 'Marcada para revisão!' : 'Removida da lista de revisão.', 'info');
      renderCurrentPage();
    }

    function updateFerrettoLessonField(lessonId, field, value) {
      const les = getLessonById(lessonId);
      if (!les) return;
      les[field] = value;
      saveState();
    }

    function confirmDeleteFerrettoLesson(lessonId) {
      const les = getLessonById(lessonId);
      if (!les) return;
      openConfirmModal(
        `Excluir aula "${les.title}"?`,
        'A aula será removida do módulo. Atividades no cronograma permanecerão registradas como histórico.',
        () => {
          state.ferrettoLessons = state.ferrettoLessons.filter(l => l.id !== lessonId);
          state.ferrettoScheduleActivities.forEach(a => {
            if (a.lessonId === lessonId) {
              a.customLessonTitle = a.customLessonTitle || les.title;
              a.lessonId = '';
            }
          });
          saveState();
          showToast('Aula removida.', 'info');
          renderCurrentPage();
        },
        'Excluir aula',
        true
      );
    }

    function scheduleLessonToToday(lessonId) {
      const les = getLessonById(lessonId);
      if (!les) return;
      const mod = getModuleById(les.moduleId);
      state.ferrettoScheduleActivities.push({
        id: `fact_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        date: selectedCronogramaDate,
        subjectId: les.subjectId,
        teacherId: les.teacherId || (mod ? mod.teacherId : ''),
        moduleId: les.moduleId,
        lessonId: les.id,
        customLessonTitle: les.title,
        duration: les.duration || 45,
        done: les.done,
        completedAt: les.completedAt,
        notes: ''
      });
      saveState();
      showToast(`Aula adicionada ao cronograma de ${formatBR(selectedCronogramaDate)}!`);
    }

    function saveSubjectExtraNotes(subjId, val) {
      const ex = getSubjectExtras(subjId);
      ex.notes = val;
      saveState();
    }

    function addSubjectMaterial(e, subjId) {
      e.preventDefault();
      const ex = getSubjectExtras(subjId);
      ex.materials.unshift({
        id: `smat_${Date.now()}`,
        title: document.getElementById('subMatTitle').value.trim(),
        url: document.getElementById('subMatUrl').value.trim()

      showToast('Material complementar adicionado!');
      renderCurrentPage();
    }

    function deleteSubjectMaterial(subjId, matId) {
      const ex = getSubjectExtras(subjId);
      ex.materials = ex.materials.filter(m => m.id !== matId);
      saveState();
      renderCurrentPage();
    }

    function addSubjectExercise(e, subjId) {
      e.preventDefault();
      const ex = getSubjectExtras(subjId);
      ex.exercises.unshift({
        id: `sex_${Date.now()}`,
        title: document.getElementById('subExTitle').value.trim(),
        total: Number(document.getElementById('subExTotal').value) || 0,
        link: document.getElementById('subExLink').value.trim(),
        done: false
      });
      saveState();
      showToast('Lista de exercícios adicionada!');

    function toggleSubjectExercise(subjId, exId) {
      const ex = getSubjectExtras(subjId);
      const item = ex.exercises.find(x => x.id === exId);
      if (item) { item.done = !item.done; saveState(); renderCurrentPage(); }
    }

    function deleteSubjectExercise(subjId, exId) {
      const ex = getSubjectExtras(subjId);
      ex.exercises = ex.exercises.filter(x => x.id !== exId);
      saveState();
      renderCurrentPage();
    }

            </div>
            <div>
